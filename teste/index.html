   persistNote(mapNote);renderPins(mapNote);closePinPanel();
  });
 });
 $('#ppOpen').addEventListener('click',()=>{closePinPanel();gotoNote(note.id)});
}

/* ===================== montagem e interação ===================== */
// a imagem de fundo do mapa também fica guardada à parte; o mapa guarda só o id dela (imgId)
function onMapImgFile(file){
 const n=noteById(S.noteId);if(!n||n.type!=='map')return;
 compressImage(file,1600,.85).then(dado=>Imagens.guardar(dado)).then(id=>{
  n.fields.map.imgId=id;delete n.fields.map.img;
  persistNote(n);
  // desenha a página de novo (montar o mapa outra vez no mesmo lugar duplicaria os cliques das ferramentas)
  if(S.noteId===n.id)renderPage(n);
 }).catch(()=>toast('Não consegui carregar esta imagem de mapa','warn'));
}
function mountMap(n){
 const stage=$('#mapStage'),img=$('#mapImg'),cv=$('#mapCv'),world=$('#mapWorld');
 if(!stage)return;
 const mf=n.fields.map;
 buildMapTools();
 S.movingPin=null;
 _view={zoom:1,tx:0,ty:0,baseW:0,baseH:0};
 const temImagem=()=>!!(mf.imgId||mf.img);
 function doResize(){
  const w=stage.clientWidth||600;
  let h;
  if(temImagem()&&img.naturalWidth)h=Math.max(220,Math.round(w*(img.naturalHeight/img.naturalWidth)));
  else h=Math.max(420,Math.round(w*.66));
  stage.style.height=h+'px';
  _view.baseW=w;_view.baseH=h;
  world.style.width=w+'px';world.style.height=h+'px';
  cv.style.width=w+'px';cv.style.height=h+'px';
  viewClamp();
  resizeCanvasRaster(n);
  applyMapView(n);
 }
 function semImagem(){img.removeAttribute('src');img.style.display='none';stage.classList.add('blank');doResize()}
 if(temImagem()){
  img.style.display='';stage.classList.remove('blank');
  img.onload=doResize;img.onerror=doResize;
  if(mf.img)img.src=mf.img;   // (dados antigos, de antes de a imagem ficar à parte)
  else{
   // a imagem fica guardada à parte: pega o endereço dela (na hora, se já foi aberta antes)
   const pronto=Imagens.enderecos.get(mf.imgId);
   if(pronto)img.src=pronto;
   else Imagens.endereco(mf.imgId).then(u=>{if(!img.isConnected)return;if(u)img.src=u;else semImagem()}).catch(semImagem);
  }
  if(img.complete&&img.naturalWidth)doResize();
 }else semImagem();
 if(_mapRO)_mapRO.disconnect();
 _mapRO=new ResizeObserver(()=>doResize());
 _mapRO.observe(stage);
 renderPins(n);
 bindMapStage(n);
 setMapTool(S.mapTool);
}
function bindMapStage(n){
 const hit=$('#mapHit'),stage=$('#mapStage'),tools=$('#mapTools');
 tools.addEventListener('click',e=>{
  const mt=e.target.closest('[data-mt]');
  if(mt){setMapTool(mt.dataset.mt);return}
  const mc=e.target.closest('[data-mc]');
  if(mc){S.mapColor=mc.dataset.mc;tools.querySelectorAll('[data-mc]').forEach(s=>s.classList.toggle('on',s===mc));return}
  if(e.target.closest('#mapBg')){$('#fileMap').click();return}
  if(e.target.closest('#mapClear')){
   confirmDlg('Limpar rotas','Remove todos os traços e marcações deste mapa. Os pinos e a imagem de fundo continuam.','Limpar').then(ok=>{
    if(!ok)return;
    n.fields.map.ops=[];persistNote(n);mapRender(n);
   });
  }
 });
 $('#mapSize').addEventListener('input',e=>{S.mapSize=+e.target.value});
 $('#zcIn').addEventListener('click',()=>zoomBy(n,1.5));
 $('#zcOut').addEventListener('click',()=>zoomBy(n,1/1.5));
 $('#zcFit').addEventListener('click',()=>resetView(n));

 stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const oldZoom=_view.zoom;
  const factor=Math.exp(-e.deltaY*0.0016);
  const newZoom=clamp(oldZoom*factor,MAP_MIN_ZOOM,MAP_MAX_ZOOM);
  const wx=(mx-_view.tx)/(_view.baseW*oldZoom),wy=(my-_view.ty)/(_view.baseH*oldZoom);
  _view.zoom=newZoom;_view.tx=mx-wx*_view.baseW*newZoom;_view.ty=my-wy*_view.baseH*newZoom;
  viewClamp();applyMapView(n);scheduleCanvasRedraw(n);
 },{passive:false});

 const touches=new Map();
 let gesture=null,gdata={};
 function stagePt(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
 hit.addEventListener('pointerdown',e=>{
  const pt=stagePt(e);
  touches.set(e.pointerId,pt);
  try{hit.setPointerCapture(e.pointerId)}catch(err){}
  if(touches.size===2){
   if(gesture==='draw'&&_mapCur){_mapCur=null;mapRender(n)}
   const pts=[...touches.values()];
   const dist=Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
   gesture='pinch';
   gdata={startDist:dist,startZoom:_view.zoom,startMid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},startTx:_view.tx,startTy:_view.ty};
   return;
  }
  if(touches.size>2)return;
  e.preventDefault();
  const p=screenToWorld(pt.x,pt.y);
  if(S.movingPin){
   const pin=(n.fields.map.pins||[]).find(x=>x.id===S.movingPin);
   if(pin){pin.x=p.x;pin.y=p.y;persistNote(n);positionPins(n)}
   S.movingPin=null;setMapTool(S.mapTool);
   if(S.pinCtx)renderPinPanel();
   return;
  }
  if(S.mapTool==='pin'){
   const pin={id:uid(),x:p.x,y:p.y,noteId:null,color:S.mapColor,icon:'mapPin'};
   const note=newPinNote(n.nb,'Novo local');
   pin.noteId=note.id;
   n.fields.map.pins.push(pin);persistNote(n);renderPins(n);
   setMapTool('nav');
   openPinPanel(n,pin,{focusName:true});
   return;
  }
  if(S.mapTool==='pen'||S.mapTool==='e'){
   gesture='draw';
   _mapCur={t:S.mapTool==='pen'?'p':S.mapTool,c:S.mapColor,s:S.mapSize,pts:[[p.x,p.y]]};
   mapRender(n);
   return;
  }
  const hp=findPinAt(n,pt.x,pt.y);
  if(hp){gesture='pinDrag';gdata={pin:hp,startX:pt.x,startY:pt.y,moved:false}}
  else{gesture='pan';gdata={startX:pt.x,startY:pt.y,startTx:_view.tx,startTy:_view.ty};stage.classList.add('panning')}
 });
 hit.addEventListener('pointermove',e=>{
  if(!touches.has(e.pointerId))return;
  const pt=stagePt(e);touches.set(e.pointerId,pt);
  if(gesture==='pinch'){
   if(touches.size<2)return;
   const pts=[...touches.values()];
   const dist=Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
   const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
   const factor=dist/gdata.startDist;
   const newZoom=clamp(gdata.startZoom*factor,MAP_MIN_ZOOM,MAP_MAX_ZOOM);
   const wx=(gdata.startMid.x-gdata.startTx)/(_view.baseW*gdata.startZoom),wy=(gdata.startMid.y-gdata.startTy)/(_view.baseH*gdata.startZoom);
   _view.zoom=newZoom;_view.tx=mid.x-wx*_view.baseW*newZoom;_view.ty=mid.y-wy*_view.baseH*newZoom;
   viewClamp();applyMapView(n);scheduleCanvasRedraw(n);
   return;
  }
  if(gesture==='draw'){
   if(!_mapCur)return;
   const p=screenToWorld(pt.x,pt.y);_mapCur.pts.push([p.x,p.y]);mapRender(n);
   return;
  }
  if(gesture==='pan'){
   _view.tx=gdata.startTx+(pt.x-gdata.startX);_view.ty=gdata.startTy+(pt.y-gdata.startY);
   viewClamp();applyMapView(n);
   return;
  }
  if(gesture==='pinDrag'){
   const dx=pt.x-gdata.startX,dy=pt.y-gdata.startY;
   if(Math.hypot(dx,dy)>5)gdata.moved=true;
   if(gdata.moved){const p=screenToWorld(pt.x,pt.y);gdata.pin.x=p.x;gdata.pin.y=p.y;positionPins(n)}
   return;
  }
 });
 function finish(e){
  touches.delete(e.pointerId);
  try{hit.releasePointerCapture(e.pointerId)}catch(err){}
  if(gesture==='pinch'){
   if(touches.size<2){gesture=null;gdata={};scheduleCanvasRedraw(n,true)}
   return;
  }
  if(gesture==='draw'){
   if(_mapCur){n.fields.map.ops.push(_mapCur);_mapCur=null;persistNote(n);mapRender(n)}
   gesture=null;return;
  }
  if(gesture==='pan'){stage.classList.remove('panning');gesture=null;return}
  if(gesture==='pinDrag'){
   const{pin,moved}=gdata;gesture=null;
   if(moved)persistNote(n);
   else openPinPanel(n,pin,{});
   return;
  }
 }
 hit.addEventListener('pointerup',finish);
 hit.addEventListener('pointercancel',finish);
}
/* ===================== 2.0: o fichário e as novidades ===================== */
// No PC (tela a partir de 1280 px) o grimório é um fichário de couro: a capa abre ao entrar, o menu fica
// no couro, a lista num bolso e a página num bloco de notas com argolas. No tablet entram as novidades da
// página (folha de rosto, retrato, selos, fita, anterior e próxima). No celular, só o lápis e a capa da campanha.
const noFichario=()=>matchMedia('(min-width:1280px)').matches;
// "calmo": a pessoa pediu ao sistema para reduzir movimento; aí nada anima
const calmo=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const tempo=t=>calmo()?0:t;
const comAnimacao=()=>noFichario()&&!calmo();
// a campanha aberta (antes de as notas carregarem ainda não há nenhuma)
const campanhaAberta=()=>DB&&DB.notebooks?nbCur():null;

// ---------- a capa de cada campanha: a cor do couro e o emblema ----------
const COUROS={marrom:'Marrom',vinho:'Vinho',verde:'Verde-musgo',azul:'Azul-noite',negro:'Negro'};
const EMBLEMAS={torre:'Torre',coroa:'Coroa',espadas:'Espadas',lua:'Lua',chave:'Chave',escudo:'Escudo'};
// a capa escolhida na campanha; sem escolha, couro marrom com a torre
// só valem os couros e emblemas da lista (um nome como "constructor" não pode passar por emblema)
const conhece=(lista,k)=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(lista,k);
function capaDa(nb){
 const c=nb&&nb.capa;
 return {couro:c&&conhece(COUROS,c.couro)?c.couro:'marrom',emblema:c&&conhece(EMBLEMAS,c.emblema)?c.emblema:'torre'};
}
// troca as classes de couro e de emblema de um elemento (o CSS desenha cada um)
function vestir(el,c){
 Object.keys(COUROS).forEach(x=>el.classList.remove('couro-'+x));
 Object.keys(EMBLEMAS).forEach(x=>el.classList.remove('emb-'+x));
 el.classList.add('couro-'+c.couro,'emb-'+c.emblema);
}
// o fichário veste a capa da campanha aberta; ela fica anotada para a capa da próxima abertura aparecer certa
function vestirFichario(){
 const nb=campanhaAberta();if(!nb)return;
 const c=capaDa(nb);
 vestir($('.app'),c);
 try{localStorage.setItem('grimorioteste_capa',JSON.stringify({couro:c.couro,emblema:c.emblema,nome:nb.name}))}catch(e){}
}
function capaGuardada(){
 try{
  const c=JSON.parse(localStorage.getItem('grimorioteste_capa')||'null');
  if(c&&conhece(COUROS,c.couro)&&conhece(EMBLEMAS,c.emblema))return c;
 }catch(e){}
 return {couro:'marrom',emblema:'torre',nome:''};
}
// janela para escolher a capa (aberta pela engrenagem da campanha)
function escolherCapa(){
 const nb=nbCur();if(!nb)return;
 const escolha=capaDa(nb);
 const m=openModal('<div class="m-orn">✦</div><h3 class="m-title">Capa da campanha</h3><p class="m-msg">'+esc(nb.name)+'</p>'
  +'<div class="capa-dlg">'
  +'<div class="capa-amostra"><span class="emblema"></span><b>Grimório<br>de Aventuras</b><i>'+esc(nb.name)+'</i></div>'
  +'<div class="capa-opcoes"><h4>Couro</h4><div class="capa-couros">'
  +Object.keys(COUROS).map(c=>'<button type="button" class="capa-couro couro-'+c+'" data-couro="'+c+'"><span></span>'+COUROS[c]+'</button>').join('')
  +'</div><h4>Emblema</h4><div class="capa-emblemas">'
  +Object.keys(EMBLEMAS).map(e=>'<button type="button" class="capa-emb emb-'+e+'" data-emb="'+e+'"><span></span>'+EMBLEMAS[e]+'</button>').join('')
  +'</div></div></div>'
  +'<div class="m-actions"><button class="btn" type="button" data-r="0">Cancelar</button><button class="btn btn-wax" type="button" data-r="1">Usar esta capa</button></div>');
 m.el.classList.add('m-capa');
 const amostra=m.el.querySelector('.capa-amostra');
 const mostrar=()=>{
  vestir(amostra,escolha);
  m.el.querySelectorAll('[data-couro]').forEach(b=>b.classList.toggle('on',b.dataset.couro===escolha.couro));
  m.el.querySelectorAll('[data-emb]').forEach(b=>b.classList.toggle('on',b.dataset.emb===escolha.emblema));
 };
 mostrar();
 m.el.addEventListener('click',e=>{
  const c=e.target.closest('[data-couro]'),em=e.target.closest('[data-emb]'),r=e.target.closest('[data-r]');
  if(c){escolha.couro=c.dataset.couro;mostrar();return}
  if(em){escolha.emblema=em.dataset.emb;mostrar();return}
  if(r){m.close();if(r.dataset.r==='1')trocarCapa(escolha)}
 });
}
// guarda a capa nova; no PC o fichário fecha, o couro e o emblema mudam e ele abre de novo
async function trocarCapa(escolha){
 const nb=nbCur();if(!nb)return;
 const antes=capaDa(nb);
 if(antes.couro===escolha.couro&&antes.emblema===escolha.emblema)return;
 const guardar=()=>{nb.capa={couro:escolha.couro,emblema:escolha.emblema};nb.ua=Date.now();scheduleSave();vestirFichario();capaNoCelular()};
 if(!comAnimacao()||ocupadoComCapa){guardar();return}
 ocupadoComCapa=true;
 const app=$('.app');
 try{
  const velha=fazerCapa(nb);
  encherDentro(velha);
  velha.style.transform='perspective(3200px) rotateY(-180deg)';
  app.classList.add('fechado');
  await girar(velha,-180,0,1300);
  guardar();
  const nova=fazerCapa(nb);
  encherDentro(nova);
  await nova.animate([{opacity:0},{opacity:1}],{duration:800,easing:'ease-in-out'}).finished;
  velha.remove();
  await abrirCapa(nova);
 }finally{terminarCapa()}
}

// ---------- a capa que abre e fecha o fichário (só no PC) ----------
let ocupadoComCapa=false;
// a capa fica sobre a metade da direita (o bloco de notas) e gira na lombada, que é o meio do fichário
function fazerCapa(nb){
 const app=$('.app'),a=app.getBoundingClientRect(),p=$('.page-pane').getBoundingClientRect();
 const capa=document.createElement('div');
 capa.className='capa-livro';
 capa.style.left=(p.left-a.left)+'px';
 capa.style.width=(a.right-p.left)+'px';
 capa.innerHTML='<div class="face fora"><span class="grossura"></span><span class="emblema"></span><b>Grimório<br>de Aventuras</b><i></i><span class="luz"></span></div>'
  +'<div class="face dentro"><span class="luz"></span></div>'
  // as bordas mostram a grossura do couro quando a capa está de lado
  +'<div class="face borda borda-lado"></div><div class="face borda borda-cima"></div><div class="face borda borda-baixo"></div>';
 const guardada=capaGuardada();
 vestirCapa(capa,nb?capaDa(nb):guardada,nb?nb.name:guardada.nome);
 app.appendChild(capa);
 return capa;
}
function vestirCapa(capa,c,nome){
 vestir(capa,c);
 capa.querySelector('.fora i').textContent=nome||'';
}
// por dentro, a capa leva uma cópia da página da esquerda (o menu e o bolso com a lista)
function encherDentro(capa){
 const dentro=capa.querySelector('.dentro'),luz=dentro.querySelector('.luz');
 const base=$('.app').getBoundingClientRect();
 const tudo=document.createElement('div');
 tudo.className='dentro-tudo';
 dentro.insertBefore(tudo,luz);
 [$('#sidebar'),$('.list-pane'),$('.app>.bolso')].forEach(orig=>{
  if(!orig)return;
  const r=orig.getBoundingClientRect();
  const c=orig.cloneNode(true);
  c.classList.add('copia');
  c.removeAttribute('id');
  c.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
  c.style.cssText='position:absolute;margin:0;visibility:visible;left:'+(r.left-base.left)+'px;top:'+(r.top-base.top)+'px;width:'+r.width+'px;height:'+r.height+'px';
  tudo.appendChild(c);
  // a cópia mostra a mesma campanha escolhida e o mesmo trecho das listas
  const so=orig.querySelector('select'),sc=c.querySelector('select');
  if(so&&sc)sc.selectedIndex=so.selectedIndex;
  const ro=orig.querySelectorAll('.note-list,.cat-list'),rc=c.querySelectorAll('.note-list,.cat-list');
  rc.forEach((x,i)=>{if(ro[i])x.scrollTop=ro[i].scrollTop});
 });
}
// gira a capa de um ângulo a outro; de lado ela escurece e mostra a grossura do couro
function girar(capa,de,para,dura){
 const t=a=>'perspective(3200px) rotateY('+a+'deg)';
 const op={duration:dura,easing:'cubic-bezier(.55,.05,.35,1)',fill:'forwards'};
 const [luzFora,luzDentro]=capa.querySelectorAll('.luz');
 const abrindo=para<de;
 // fechada, a capa mostra a grossura embaixo; ao girar, essa sombra some e quem aparece é a borda de verdade
 capa.querySelector('.grossura').animate(abrindo?[{opacity:1},{opacity:0,offset:.22},{opacity:0}]
  :[{opacity:0},{opacity:0,offset:.78},{opacity:1}],op);
 luzFora.animate(abrindo?[{opacity:0},{opacity:.55,offset:.5},{opacity:.55}]:[{opacity:.55},{opacity:.55,offset:.5},{opacity:0}],op);
 luzDentro.animate(abrindo?[{opacity:.55},{opacity:.55,offset:.5},{opacity:0}]:[{opacity:0},{opacity:.55,offset:.5},{opacity:.55}],op);
 return capa.animate([{transform:t(de)},{transform:t(para)}],op).finished;
}
function abrirCapa(capa){
 return girar(capa,0,-180,1500).then(()=>{$('.app').classList.remove('fechado');capa.remove()});
}
// no fim de cada animação de capa (mesmo se algo der errado), o fichário fica aberto e sem capas soltas
function terminarCapa(){
 ocupadoComCapa=false;
 $('.app').classList.remove('fechado','trocando');
 $$('.app>.capa-livro').forEach(c=>c.remove());
}
// ao entrar: no PC o fichário aparece fechado na mesa e abre quando as notas carregam
let capaDaEntrada=null;
function prepararEntrada(){
 if(comAnimacao()){ocupadoComCapa=true;capaDaEntrada=fazerCapa(null)}
 else $('.app').classList.remove('fechado');
 if(isMobile())mostrarCapaNoCelular();
}
function abrirNaEntrada(){
 vestirFichario();
 capaNoCelular();
 if(isMobile())setTimeout(esconderCapaNoCelular,900);
 if(noFichario())mostrarFolhaDeRosto();
 const capa=capaDaEntrada;
 capaDaEntrada=null;
 if(!capa){terminarCapa();return}
 const nb=nbCur();
 vestirCapa(capa,capaDa(nb),nb?nb.name:'');
 setTimeout(()=>{encherDentro(capa);abrirCapa(capa).finally(terminarCapa)},300);
}
// trocar de campanha no PC: o fichário fecha, sai da mesa, e o da outra campanha entra e abre
async function trocarDeCampanha(id){
 if(id===S.nb)return;
 // no celular, a capa da outra campanha aparece um instante
 if(isMobile()){switchNotebook(id);mostrarCapaNoCelular();setTimeout(esconderCapaNoCelular,1100);return}
 if(!comAnimacao()||ocupadoComCapa){switchNotebook(id);return}
 ocupadoComCapa=true;
 const app=$('.app');
 try{
  const velha=fazerCapa(nbCur());
  encherDentro(velha);
  velha.style.transform='perspective(3200px) rotateY(-180deg)';
  app.classList.add('fechado');
  await girar(velha,-180,0,1300);
  switchNotebook(id);
  app.classList.add('trocando');
  await velha.animate([{transform:'perspective(3200px) translateY(0) scale(1)',opacity:1},
   {transform:'perspective(3200px) translateY(80px) scale(.96)',opacity:0}],{duration:380,easing:'ease-in',fill:'forwards'}).finished;
  velha.remove();
  const nova=fazerCapa(nbCur());
  encherDentro(nova);
  await nova.animate([{transform:'perspective(3200px) translateY(-80px) scale(.96)',opacity:0},
   {transform:'perspective(3200px) translateY(0) scale(1)',opacity:1}],{duration:420,easing:'ease-out'}).finished;
  app.classList.remove('trocando');
  await abrirCapa(nova);
 }finally{terminarCapa()}
}

// ---------- no celular: a capa da campanha aparece um instante ao abrir ----------
// a capa do celular usa o couro e o emblema da campanha; some sozinha (ou com um toque)
function capaNoCelular(){
 const el=$('#capaCelular');if(!el)return;
 const nb=campanhaAberta();
 vestir(el,nb?capaDa(nb):capaGuardada());
 el.querySelector('i').textContent=nb?nb.name:capaGuardada().nome;
}
function mostrarCapaNoCelular(){
 const el=$('#capaCelular');if(!el)return;
 capaNoCelular();
 el.hidden=false;
 el.addEventListener('click',()=>esconderCapaNoCelular(),{once:true});
}
function esconderCapaNoCelular(){
 const el=$('#capaCelular');
 if(!el||el.hidden||el.classList.contains('saindo'))return;
 if(calmo()){el.hidden=true;return}
 el.classList.add('saindo');
 setTimeout(()=>{el.hidden=true;el.classList.remove('saindo')},450);
}

// ---------- a folha de rosto: a abertura da campanha, com o resumo da mesa ----------
// o começo do que foi escrito na sessão, sem os títulos das seções e sem os horários
function trechoDe(n){
 const t=document.createElement('template');
 t.innerHTML=n.html||'';
 t.content.querySelectorAll('h1,h2,h3,h4,.nh').forEach(x=>x.remove());
 const texto=[...t.content.querySelectorAll('p,li')].map(x=>x.textContent.trim()).filter(Boolean).join(' · ');
 return texto.length>150?texto.slice(0,150).replace(/\s+\S*$/,'')+'…':texto;
}
function mostrarFolhaDeRosto(){
 if(isMobile())return;
 const nb=nbCur();if(!nb)return;
 guardarMapaNaHora();
 S.livro=null;S.tabelaCat=null;
 closeHashSug();closeRefSug();closePop();
 S.noteId=null;markActive();
 const ultima=sessaoMaisRecente();
 const itens=[];
 pendenciasDaCampanha().forEach(g=>g.itens.forEach(it=>itens.push({nota:g.nota,texto:it.texto})));
 const marcadas=DB.notes.filter(n=>n.nb===S.nb&&n.pin).sort((a,b)=>b.ua-a.ua);
 const caps=catsOf(S.nb).map(c=>({c,n:notesInCat(c.id).length})).filter(x=>x.n);
 const bloco=(titulo,corpo)=>'<section class="fr-bloco"><h3>'+titulo+'</h3>'+corpo+'</section>';
 const trecho=ultima?trechoDe(ultima):'';
 $('#book').innerHTML='<div class="page folha-rosto" id="page"><div class="spine" aria-hidden="true"><i></i><i></i><i></i></div>'
  +'<div class="page-scroll"><div class="fr-moldura">'
  +'<span class="fr-emblema" aria-hidden="true"></span>'
  +'<div class="fr-sobre">Grimório de Aventuras</div>'
  +'<h1 class="fr-nome">'+esc(nb.name)+'</h1>'+ORNAMENTO
  +'<div class="fr-sub">diário de campanha · desde '+fmtDate(nb.ca||Date.now())+'</div>'
  +'<div class="fr-resumo">'
  +bloco('Última sessão',ultima
    ?'<button class="fr-abre fr-sessao" type="button" data-id="'+ultima.id+'"><b>'+esc(ultima.title)+'</b>'
     +(ultima.fields.data?'<span>'+esc(ultima.fields.data)+'</span>':'')+'</button>'
     +(trecho?'<p class="fr-trecho">'+esc(trecho)+'</p>':'')
    :'<p class="fr-nada">Nenhuma sessão ainda.</p>')
  +bloco('Pendências abertas'+(itens.length?' <span class="fr-conta">'+itens.length+'</span>':''),itens.length
    ?'<ul class="fr-lista">'+itens.slice(0,3).map(it=>'<li><button class="fr-abre" type="button" data-id="'+it.nota.id+'">'
      +'<span class="fr-caixa"></span>'+esc(it.texto)+'<i>'+esc(it.nota.title)+'</i></button></li>').join('')+'</ul>'
     +(itens.length>3?'<button class="fr-todas" type="button">ver todas</button>':'')
    :'<p class="fr-nada">Nada pendente.</p>')
  +bloco('Páginas marcadas',marcadas.length
    ?'<div class="fr-marcadas">'+marcadas.map(n=>'<button class="fr-abre fr-chip" type="button" data-id="'+n.id+'">'+icon('star')+esc(n.title)+'</button>').join('')+'</div>'
    :'<p class="fr-nada">Nenhuma página marcada.</p>')
  +'</div>'
  // cada capítulo fica junto do seu número (a linha só quebra entre um capítulo e outro)
  +(caps.length?'<div class="fr-capitulos">'+caps.map(x=>'<span class="fr-cap">'+esc(x.c.name)+' <b>'+x.n+'</b></span>').join('<span class="fr-sep">·</span>')+'</div>':'')
  +'</div></div></div>';
}

// ---------- a página: retrato, selo de cera e anterior/próxima (no PC e no tablet) ----------
const statusDe=n=>n.type==='mission'?(n.fields.status||''):(n.type==='npc'?(n.fields.statusn||''):'');
// a cabeça da página junta o retrato, o título e o selo (é criada só quando a página tem um dos dois)
function cabecaDaPagina(){
 let cab=$('#book .cabeca');
 if(cab)return cab;
 const titulo=$('#pageTitle');
 if(!titulo)return null;
 cab=document.createElement('div');
 cab.className='cabeca';
 const orn=titulo.nextElementSibling&&titulo.nextElementSibling.classList.contains('orn')?titulo.nextElementSibling:null;
 titulo.before(cab);
 cab.append(titulo);
 if(orn)cab.append(orn);
 return cab;
}
// o status vira um selo de cera ao lado do título; ao mudar o status, o selo novo é carimbado
function selarPagina(n,carimbar){
 if(isMobile())return;
 const st=statusDe(n);
 let selo=$('#book .selo-titulo');
 if(!st){if(selo){selo.remove();arrumarCabeca()}return}
 const cab=cabecaDaPagina();
 if(!cab)return;
 if(!selo){selo=document.createElement('span');selo.className='selo-titulo';cab.append(selo);arrumarCabeca()}
 selo.dataset.st=st;
 selo.title=st;
 if(carimbar&&!calmo()){selo.classList.remove('batendo');void selo.offsetWidth;selo.classList.add('batendo')}
}
// a primeira imagem de um NPC ou local vira o retrato, numa moldura oval ao lado do título e na lista
const TIPOS_RETRATO=['npc','location'];
const primeiraImagem=n=>{const m=/<img\b[^>]*data-img="([^"]+)"/.exec(n.html||'');return m?m[1]:null};
function comImagem(id,fazer){
 const u=Imagens.enderecos.get(id);
 if(u){fazer(u);return}
 Imagens.endereco(id).then(x=>{if(x)fazer(x)}).catch(()=>{});
}
// a imagem que virou retrato não aparece de novo no texto da página
const estiloDosRetratos=document.createElement('style');
document.head.appendChild(estiloDosRetratos);
const imagensDeRetrato=new Set();
function retratoNaPagina(n){
 const id=TIPOS_RETRATO.includes(n.type)?primeiraImagem(n):null;
 if(!id)return;
 if(!imagensDeRetrato.has(id)){
  imagensDeRetrato.add(id);
  estiloDosRetratos.textContent=[...imagensDeRetrato].map(x=>'.com-retrato .page-body img[data-img="'+x+'"]').join(',')+'{display:none}';
 }
 $('#page').classList.add('com-retrato');
 const cab=cabecaDaPagina();
 if(!cab)return;
 const r=document.createElement('button');
 r.type='button';
 r.className='retrato';
 r.dataset.img=id;
 r.title='Retrato (a primeira imagem da página)';
 cab.prepend(r);
 comImagem(id,u=>{r.style.backgroundImage='url("'+u+'")'});
}
// tocar no retrato: dá para tirar a imagem (ela fica escondida no texto, então o menu da imagem vem para cá)
function menuDoRetrato(r){
 const n=noteById(S.noteId);if(!n)return;
 popover(r,[{id:'del',ic:'trash',label:'Remover retrato',danger:true}]).then(escolha=>{
  if(escolha!=='del'||S.noteId!==n.id)return;
  const img=$('#pageBody img[data-img="'+r.dataset.img+'"]');
  if(img)img.remove();
  n.html=$('#pageBody').innerHTML;persistNote(n);
  renderPage(n);
 });
}
function miniaturasDaLista(){
 if(isMobile())return;
 $$('#noteList .ni').forEach(el=>{
  const n=noteById(el.dataset.id);
  if(!n||!TIPOS_RETRATO.includes(n.type))return;
  const id=primeiraImagem(n);
  const ic=el.querySelector('.ni-ic');
  if(!id||!ic||ic.querySelector('.ni-ck,.ni-retrato'))return;
  ic.innerHTML='<span class="ni-retrato"></span>';
  comImagem(id,u=>{const s=ic.querySelector('.ni-retrato');if(s)s.style.backgroundImage='url("'+u+'")'});
 });
}
// no pé da página: "‹ anterior · NPCs, 1 de 2 · próxima ›", na ordem da lista do capítulo
function navegacaoDoCapitulo(n){
 const c=n.cat?catById(n.cat):null;
 const rolar=$('#book .page-scroll');
 if(!c||!rolar)return;
 const lista=(c.ntype==='session'?sortSessions:sortNotes)(DB.notes.filter(x=>x.nb===S.nb&&x.cat===n.cat));
 const i=lista.findIndex(x=>x.id===n.id);
 if(i<0)return;
 const ant=lista[i-1],prox=lista[i+1];
 rolar.insertAdjacentHTML('beforeend','<nav class="pe-pagina" aria-label="Páginas do capítulo">'
  +'<button class="pp-ant" type="button"'+(ant?' data-id="'+ant.id+'" title="'+esc(ant.title)+'"':' disabled')+'>‹ anterior</button>'
  +'<span class="pp-onde">'+esc(c.name)+', '+(i+1)+' de '+lista.length+'</span>'
  +'<button class="pp-prox" type="button"'+(prox?' data-id="'+prox.id+'" title="'+esc(prox.title)+'"':' disabled')+'>próxima ›</button></nav>');
}
function enfeitarPagina(n){
 if(isMobile())return;
 retratoNaPagina(n);
 selarPagina(n,false);
 navegacaoDoCapitulo(n);
 arrumarCabeca();
}
// a cabeça avisa se tem retrato e selo (no fichário, os dois lados ficam da mesma largura, com o título no meio)
function arrumarCabeca(){
 const cab=$('#book .cabeca');
 if(cab){
  cab.classList.toggle('tem-retrato',!!cab.querySelector('.retrato'));
  cab.classList.toggle('tem-selo',!!cab.querySelector('.selo-titulo'));
 }
 ajustarTitulo();
}
// título comprido: a letra diminui (até 60%) para caber na linha; se nem assim couber, o título inteiro aparece ao parar o mouse
function ajustarTitulo(){
 const t=$('#pageTitle');
 if(!t)return;
 t.style.fontSize='';
 t.removeAttribute('title');
 if(isMobile())return;
 const normal=parseFloat(getComputedStyle(t).fontSize);
 let tam=normal;
 while(t.scrollWidth>t.clientWidth+1&&tam>normal*.6){tam=Math.max(normal*.6,tam-1);t.style.fontSize=tam+'px'}
 if(t.scrollWidth>t.clientWidth+1)t.title=t.value;
}
// a fita de marcador cai na página quando ela ganha a estrela
function soltarFita(){
 const pag=$('#page');
 if(!pag||calmo())return;
 pag.classList.remove('fita-nova');void pag.offsetWidth;pag.classList.add('fita-nova');
 setTimeout(()=>pag.classList.remove('fita-nova'),800);
}

// ---------- o lápis: marca um trecho como suspeita; num trecho a lápis, o mesmo botão apaga ----------
function usarLapis(){
 const ed=$('#pageBody');if(!ed)return;
 const s=getSelection();
 if(!s.rangeCount||!ed.contains(s.anchorNode))return;
 const n=noteById(S.noteId);if(!n)return;
 // grava na hora, na página onde o lápis foi usado (mesmo que outra página seja aberta durante a animação);
 // as classes que só servem para a animação não vão para as notas
 const gravar=()=>{
  const copia=ed.cloneNode(true);
  copia.querySelectorAll('.lapis-sai').forEach(x=>x.replaceWith(...x.childNodes));
  copia.querySelectorAll('.lapis-novo').forEach(x=>x.classList.remove('lapis-novo'));
  n.html=copia.innerHTML;persistNote(n,{skipTagScan:true});
 };
 const no=s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement;
 const marcado=no&&no.closest('#pageBody .lapis');
 if(marcado){
  // a teoria se confirmou: o traço some e o texto volta a ser tinta
  s.removeAllRanges();
  marcado.classList.add('lapis-sai');
  gravar();
  setTimeout(()=>{if(marcado.isConnected)marcado.replaceWith(...marcado.childNodes)},tempo(560));
  return;
 }
 if(s.isCollapsed){toast('Escolha o trecho que vai a lápis');return}
 const trecho=document.createElement('span');
 trecho.className='lapis lapis-novo';
 try{s.getRangeAt(0).surroundContents(trecho)}
 catch(erro){toast('O lápis marca um trecho dentro de um mesmo parágrafo');return}
 s.removeAllRanges();
 gravar();
 setTimeout(()=>trecho.classList.remove('lapis-novo'),tempo(900));
}

// ---------- o mapa em rolo de papel (só no PC) ----------
// na página fica o rolo amarrado; ao abrir, o barbante solta e o papel desenrola na tela
let mapaAberto=null;
function botaoDoMapa(n){
 return '<button class="abrir-mapa" type="button"><span class="rolo-icone" aria-hidden="true"></span>'
  +'<span><b>Abrir o mapa</b><i>'+esc(n.title)+'</i></span></button>';
}
// "naHora": abre sem a animação (quando a página do mapa é desenhada de novo com ele aberto)
function abrirMapa(naHora){
 const wrap=$('#book .map-wrap');
 if(!wrap||mapaAberto)return;
 const n=noteById(S.noteId);
 const marca=document.createComment('mapa');
 wrap.before(marca);
 const tela=document.createElement('div');
 tela.className='mapa-aberto';
 tela.innerHTML='<div class="pergaminho"><div class="folha-mapa"><div class="mapa-topo"><b></b>'
  +'<button class="btn enrolar-mapa" type="button">Enrolar o mapa</button></div></div>'
  +'<div class="rolo-papel"><span class="barbante"></span></div></div>';
 tela.querySelector('.mapa-topo b').textContent=n?n.title:'';
 document.body.appendChild(tela);
 const folha=tela.querySelector('.folha-mapa');
 // o mapa cabe inteiro na altura da tela; a folha fica do tamanho dele, com margem
 const img=wrap.querySelector('#mapImg');
 const prop=img&&img.naturalWidth&&img.style.display!=='none'?img.naturalHeight/img.naturalWidth:.66;
 const largura=Math.min(Math.round(innerWidth*.94)-190,Math.round((innerHeight-360)/prop));
 tela.querySelector('.pergaminho').style.width=(largura+190)+'px';
 wrap.style.width=largura+'px';
 wrap.style.margin='0 auto';
 folha.appendChild(wrap);
 // o painel do pino (e o das referências) abre por cima do mapa, na direita da tela
 const painel=$('#refPanel'),lugarPainel=document.createComment('painel');
 painel.before(lugarPainel);
 tela.appendChild(painel);
 mapaAberto={id:n?n.id:null,tela,wrap,marca,painel,lugarPainel};
 const rolo=tela.querySelector('.rolo-papel'),barbante=rolo.querySelector('.barbante');
 const D=naHora?0:tempo(2400),solto=.38,suave='cubic-bezier(.35,.05,.3,1)';
 tela.animate([{backgroundColor:'rgba(16,9,5,0)'},{backgroundColor:'rgba(16,9,5,.82)'}],{duration:naHora?0:tempo(400),fill:'forwards'});
 // o rolo chega, espera o barbante soltar e desce desenrolando (e fica mais fino, porque o papel sai dele)
 rolo.animate([
  {opacity:0,top:'-70px',height:'76px',offset:0},
  {opacity:1,top:'-40px',height:'76px',offset:.16,easing:'linear'},
  {opacity:1,top:'-40px',height:'76px',offset:solto,easing:suave},
  {opacity:1,top:'calc(100% - 30px)',height:'46px',offset:1}
 ],{duration:D,fill:'forwards'});
 barbante.animate([
  {opacity:1,transform:'none',offset:0},
  {opacity:1,transform:'none',offset:.18,easing:'ease-in'},
  {opacity:0,transform:'translateY(46px) rotate(10deg)',offset:solto-.02},
  {opacity:0,transform:'translateY(46px) rotate(10deg)',offset:1}
 ],{duration:D,fill:'forwards'});
 folha.animate([
  {clipPath:'inset(0 0 100% 0)',offset:0},
  {clipPath:'inset(0 0 100% 0)',offset:solto,easing:suave},
  {clipPath:'inset(0 0 0% 0)',offset:1}
 ],{duration:D,fill:'forwards'});
}
// o mapa volta para a página: o painel e o mapa voltam aos seus lugares
function devolverMapa(m){
 m.wrap.style.width='';m.wrap.style.margin='';
 if(m.marca.isConnected)m.marca.replaceWith(m.wrap);else m.wrap.remove();
 if(m.lugarPainel.isConnected)m.lugarPainel.replaceWith(m.painel);
 m.tela.remove();
}
function enrolarMapa(){
 if(!mapaAberto)return;
 const m=mapaAberto;
 mapaAberto=null;
 // se o painel do pino estiver aberto, ele fecha junto
 if(S.refId||S.pinCtx)closeRefPanel();
 const folha=m.tela.querySelector('.folha-mapa'),rolo=m.tela.querySelector('.rolo-papel'),barbante=rolo.querySelector('.barbante');
 const D=tempo(1700),suave='cubic-bezier(.5,0,.6,1)';
 [rolo,barbante,folha].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
 // o rolo sobe enrolando o papel, o barbante volta e tudo some
 rolo.animate([
  {opacity:1,top:'calc(100% - 30px)',height:'46px',offset:0,easing:suave},
  {opacity:1,top:'-40px',height:'76px',offset:.7},
  {opacity:1,top:'-40px',height:'76px',offset:.86},
  {opacity:0,top:'-60px',height:'76px',offset:1}
 ],{duration:D,fill:'forwards'});
 barbante.animate([
  {opacity:0,transform:'translateY(46px) rotate(10deg)',offset:0},
  {opacity:0,transform:'translateY(46px) rotate(10deg)',offset:.66,easing:'ease-out'},
  {opacity:1,transform:'none',offset:.8},
  {opacity:1,transform:'none',offset:1}
 ],{duration:D,fill:'forwards'});
 folha.animate([
  {clipPath:'inset(0 0 0% 0)',offset:0,easing:suave},
  {clipPath:'inset(0 0 100% 0)',offset:.7},
  {clipPath:'inset(0 0 100% 0)',offset:1}
 ],{duration:D,fill:'forwards'});
 m.tela.animate([{opacity:1},{opacity:1,offset:.84},{opacity:0}],{duration:D,fill:'forwards'}).finished.then(()=>devolverMapa(m));
}
// se a página for desenhada de novo com o mapa aberto, o mapa volta para ela na hora
// devolve o mapa aberto para a página antes de ela ser desenhada de novo; diz de qual página ele era
function guardarMapaNaHora(){
 if(!mapaAberto)return null;
 const m=mapaAberto;
 mapaAberto=null;
 devolverMapa(m);
 return m.id;
}

// ---------- os cliques das novidades ----------
function ligarNovidades(){
 document.addEventListener('click',e=>{
  if(e.target.closest('.abrir-mapa')){abrirMapa();return}
  if(e.target.closest('.enrolar-mapa')){enrolarMapa();return}
  const fr=e.target.closest('.folha-rosto .fr-abre');
  if(fr){openNote(fr.dataset.id);return}
  if(e.target.closest('.folha-rosto .fr-todas')){setView({kind:'pend'});return}
  const rt=e.target.closest('#book .retrato');
  if(rt){menuDoRetrato(rt);return}
  const pp=e.target.closest('#book .pe-pagina button[data-id]');
  if(pp){openNote(pp.dataset.id);return}
  // o nome do grimório, no alto do menu, abre a folha de rosto
  if(e.target.closest('#sidebar .brand')&&!isMobile()&&!$('#page.folha-rosto'))mostrarFolhaDeRosto();
 });
 // o título se ajusta à linha enquanto é digitado, quando a janela muda de tamanho e quando as letras terminam de carregar
 document.addEventListener('input',e=>{if(e.target.id==='pageTitle')ajustarTitulo()});
 let espera=0;
 addEventListener('resize',()=>{clearTimeout(espera);espera=setTimeout(ajustarTitulo,150)});
 // quando as letras terminam de carregar: o título se ajusta de novo, e a caixa da campanha é medida outra vez
 // (o navegador não refaz sozinho o tamanho de uma caixa de escolha desenhada antes das letras chegarem)
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{
  ajustarTitulo();
  const sel=$('#nbSelect');
  if(sel){sel.style.display='none';void sel.offsetHeight;sel.style.display=''}
 });
 // em tela baixa os botões do rodapé do menu ficam só com o desenho: o nome aparece ao parar o mouse
 [['helpBtn','Ajuda'],['exportBtn','Exportar (backup)'],['importBtn','Importar']].forEach(([id,nome])=>{const b=$('#'+id);if(b&&!b.title)b.title=nome});
}

/* ===================== inicialização ===================== */
(async function(){
 try{
  prepararEntrada();
  await Store.init();
  const salvo=await Store.load();
  const raw=salvo.dados;
  // ajustes deste aparelho; na primeira abertura depois da versão 3, eles vêm de dentro dos dados antigos
  AJUSTES=Object.assign({},(raw&&raw.settings)||{},salvo.ajustes||{});
  const versaoSalva=raw&&raw.version;
  const imagensJunto=raw&&raw.imagens;   // (só quando não há IndexedDB: as imagens vão junto das notas)
  DB=raw?migrate(raw):seed();
  // a versão de cada item que está gravada no IndexedDB (para juntar com outra aba depois)
  if(raw&&!salvo.antigo)Store.conhecidas=versoesDe(DB);
  await receberImagens(imagensJunto);
  // imagens que ainda estavam dentro do texto (versões antigas) passam a ficar à parte
  const imagensMovidas=await tirarImagensDoTexto(DB);
  // a cópia das versões antigas (no localStorage) só sai quando o IndexedDB já abriu com os dados;
  // antes, o que foi editado nela depois (abrindo o arquivo antigo do grimório) entra aqui
  const copiaJuntada=Store.mode==='idb'&&!salvo.antigo?await juntarCopiaAntiga():false;
  const last=AJUSTES.last||{};
  S.nb=(last.nb&&DB.notebooks.some(nb=>nb.id===last.nb))?last.nb:(DB.notebooks[0]&&DB.notebooks[0].id);
  const startNote=(last.nb===S.nb&&last.note)?noteById(last.note):null;
  applyView(startNote?(startNote.cat?{kind:'cat',id:startNote.cat}:{kind:'comp'}):{kind:'rec'});
  bindGlobal();
  renderSidebar();renderList();
  const open=startNote||pickDefaultNote();
  if(open)openNote(open.id,{skipAnim:true});else renderPage(null);
  abrirNaEntrada();
  // salva logo quando é a primeira vez ou quando as notas acabaram de ser convertidas para a versão nova
  if(!raw||versaoSalva!==DB.version||imagensMovidas||salvo.antigo||copiaJuntada){_pendente=true;flushSave()}
  pedirArmazenamentoPersistente();
  ghIniciar();
  registrarAplicativo();
  // imagens que nenhuma página usa mais são apagadas, sem atrasar a abertura
  setTimeout(()=>limparImagensSoltas().catch(()=>{}),8000);
 }catch(err){
  document.body.innerHTML='<pre style="padding:26px;white-space:pre-wrap;color:#7d2b23;font:13px/1.5 monospace;background:#f6ecd4">Não consegui abrir o Grimório de Aventuras.\n\n'+String((err&&err.stack)||err)+'</pre>';
 }
})();
