// separa a busca em palavras sem acento; as que começam com # procuram só nas tags
function palavrasDaBusca(q){
 const todas=semAcento(norm(q)).split(' ').filter(Boolean);
 return{
  termos:todas.filter(w=>w[0]!=='#'),
  tags:todas.filter(w=>w[0]==='#').map(w=>w.slice(1)).filter(Boolean)
 };
}
// destaca no texto as palavras buscadas, sem ligar para acentos e maiúsculas
function hiText(t,q){
 t=String(t);
 const termos=palavrasDaBusca(q).termos;
 if(!termos.length)return esc(t);
 const {base,origem}=mapaSemAcento(t);
 const marcar=new Array(t.length).fill(false);
 termos.forEach(w=>{
  let k=base.indexOf(w);
  while(k>=0){
   for(let j=k;j<k+w.length;j++)marcar[origem[j]]=true;
   k=base.indexOf(w,k+w.length);
  }
 });
 // junta as letras marcadas seguidas dentro de um único <mark>
 let out='',aberto=false;
 for(let i=0;i<t.length;i++){
  if(marcar[i]&&!aberto){out+='<mark>';aberto=true}
  if(!marcar[i]&&aberto){out+='</mark>';aberto=false}
  out+=esc(t[i]);
 }
 return out+(aberto?'</mark>':'');
}
function snippetFor(n,q){
 const p=plain(n.html);
 const termos=palavrasDaBusca(q).termos;
 // o trecho começa perto da primeira palavra buscada que aparece no texto
 const base=semAcento(p);
 let i=-1;
 termos.forEach(w=>{const k=base.indexOf(w);if(k>=0&&(i<0||k<i))i=k});
 if(i<0)return esc(p.slice(0,90));
 const a=Math.max(0,i-40);
 return (a>0?'…':'')+hiText(p.slice(a,i+100),q)+'…';
}
function sItem(n,q){
 const c=n.cat?catById(n.cat):null;
 const tm=TYPE_META[n.type]||TYPE_META.text;
 return '<button class="s-item" data-note="'+n.id+'">'
  +'<span class="ni-ic">'+icon(c?(c.icon||'leaf'):tm.ic)+'</span>'
  +'<span class="s-main"><span class="s-t">'+hiText(n.title||'Sem título',q)+'</span>'
  +'<span class="s-s">'+snippetFor(n,q)+'</span></span>'
  +'<span class="s-meta">'+(c?esc(c.name):tm.label)+'</span></button>';
}
function runSearch(qRaw){
 const q=semAcento(norm(qRaw));
 const host=$('#searchResults');
 const all=DB.notes.filter(n=>n.nb===S.nb);
 if(!q){
  const rec=all.slice().sort((a,b)=>(b.la||0)-(a.la||0)).slice(0,6);
  host.innerHTML=rec.length?('<div class="s-h">Recentes</div>'+rec.map(n=>sItem(n,'')).join('')):'<div class="s-empty">Escreve, e o grimório encontra.</div>';
  _sIdx=0;updateSActive();
  return;
 }
 const busca=palavrasDaBusca(qRaw);
 const porId=new Map(all.map(n=>[n.id,n]));
 // sugestões de tags e capítulos parecidos com o que foi digitado
 const qChip=q.replace(/^#/,'');
 const tagSet={};
 all.forEach(n=>(n.tags||[]).forEach(t=>{if(semAcento(t).includes(qChip))tagSet[keyOf(t)]=t}));
 const tags=Object.keys(tagSet).map(k=>tagSet[k]).slice(0,8);
 const cats=catsOf(S.nb).filter(c=>semAcento(c.name).includes(qChip)).slice(0,4);
 const scored=[];
 all.forEach(n=>{
  const titulo=semAcento(n.title);
  const tagsNota=(n.tags||[]).map(semAcento);
  // cada #tag digitada precisa estar na nota (basta a tag começar igual)
  if(!busca.tags.every(t=>tagsNota.some(x=>x.startsWith(t))))return;
  let sc=busca.tags.length?3:0;
  // cada palavra precisa aparecer em algum lugar da nota, em qualquer ordem
  for(const w of busca.termos){
   let p=0;
   if(titulo.includes(w))p+=titulo.startsWith(w)?7:5;
   if(tagsNota.some(t=>t.includes(w)))p+=3;
   if((n.refs||[]).some(id=>{const a=porId.get(id);return a&&semAcento(a.title).includes(w)}))p+=2;
   if((n.text||'').includes(w))p+=1;
   if(!p)return;
   sc+=p;
  }
  if(sc)scored.push([sc,n]);
 });
 scored.sort((a,b)=>b[0]-a[0]||b[1].ua-a[1].ua);
 const notes=scored.slice(0,14).map(x=>x[1]);
 let html='';
 if(tags.length||cats.length){
  html+='<div class="s-chips">'
   +tags.map(t=>'<button class="tag-chip" data-tag="'+esc(t)+'">#'+esc(t)+'</button>').join('')
   +cats.map(c=>'<button class="tag-chip" data-cat="'+c.id+'">'+icon(c.icon||'leaf')+esc(c.name)+'</button>').join('')
   +'</div>';
 }
 if(notes.length)html+='<div class="s-h">Páginas</div>'+notes.map(n=>sItem(n,qRaw)).join('');
 if(!html)html='<div class="s-empty">Nada encontrado nestas páginas.</div>';
 html+='<button class="s-new" type="button">'+icon('plus')+'<span>Anotar "'+esc(norm(qRaw).slice(0,60))+'" '+esc(textoDoDestino(destinoPadrao()))+'</span></button>';
 host.innerHTML=html;
 _sIdx=0;updateSActive();
}

/* ===================== exportar / importar ===================== */
// o aparelho ainda só tem o exemplo que vem com o grimório (nada criado, editado ou excluído)
function soExemplo(d){
 const intocado=x=>x.exemplo&&x.ua===x.ca;
 return d.notebooks.length===1&&d.notebooks.every(intocado)&&d.categories.every(intocado)
  &&d.notes.every(intocado)&&!d.lixeira.length&&!d.apagadas.length;
}
// junta o backup ("veio") com o que está neste aparelho ("aqui"). De cada campanha, capítulo e página
// fica a versão editada por último (ua maior; no empate, a daqui). O que foi excluído de vez continua
// excluído, a não ser que tenha sido editado depois da exclusão. Num aparelho que só tem o exemplo,
// o exemplo dá lugar ao backup. Devolve os dados juntos e quantas páginas chegaram ou mudaram
function juntarDados(aqui,veio){
 if(soExemplo(aqui))return {dados:veio,novas:veio.notes.length,atualizadas:0,trocouExemplo:true};
 const conta={novas:0,atualizadas:0};
 // exclusões das duas partes (de cada id, vale a mais recente)
 const apagadas=new Map();
 aqui.apagadas.concat(veio.apagadas).forEach(a=>{if(!(apagadas.get(a.id)>=a.ua))apagadas.set(a.id,a.ua)});
 const excluido=x=>apagadas.has(x.id)&&apagadas.get(x.id)>=(x.ua||0);
 const juntar=(daqui,dela,saoPaginas)=>{
  const porId=new Map(daqui.map(x=>[x.id,x]));
  dela.forEach(x=>{
   const atual=porId.get(x.id);
   if(atual&&(x.ua||0)<=(atual.ua||0))return;   // a versão daqui é igual ou mais nova
   if(saoPaginas&&!excluido(x)){if(atual)conta.atualizadas++;else conta.novas++}
   porId.set(x.id,x);
  });
  return [...porId.values()].filter(x=>!excluido(x));
 };
 const idsAqui=new Set(aqui.notebooks.map(b=>b.id));
 // páginas vivas e da lixeira entram juntas: a versão mais nova diz se a página está na lixeira (tem "del") ou não
 const paginas=juntar(aqui.notes.concat(aqui.lixeira),veio.notes.concat(veio.lixeira),true);
 const d={version:aqui.version,
  notebooks:juntar(aqui.notebooks,veio.notebooks),
  categories:juntar(aqui.categories,veio.categories),
  notes:paginas.filter(n=>!n.del),
  lixeira:paginas.filter(n=>n.del)};
 // uma exclusão que perdeu para uma edição mais nova não precisa mais ficar registrada
 const vivos=new Set(d.notebooks.concat(d.categories,paginas).map(x=>x.id));
 d.apagadas=[...apagadas].filter(([id])=>!vivos.has(id)).map(([id,ua])=>({id,ua}));
 // campanha que veio com o mesmo nome de uma daqui (mas é outra campanha) ganha "(importada)".
 // Só o nome muda, não a data de edição: no aparelho de origem ela continua com o nome de sempre
 const nomes=new Set(d.notebooks.filter(b=>idsAqui.has(b.id)).map(b=>semAcento(norm(b.name))));
 d.notebooks.forEach(b=>{
  if(idsAqui.has(b.id))return;
  if(nomes.has(semAcento(norm(b.name)))){
   let nome=b.name+' (importada)',k=2;
   while(nomes.has(semAcento(norm(nome))))nome=b.name+' (importada '+(k++)+')';
   b.name=nome;
  }
  nomes.add(semAcento(norm(b.name)));
 });
 consertarOrfas(d);
 return {dados:d,novas:conta.novas,atualizadas:conta.atualizadas,trocouExemplo:false};
}
/* --- duas abas abertas no mesmo aparelho --- */
// junta o que outra aba gravou ("veio") com o que está nesta ("aqui"). "conhecidas" é a versão de cada item na
// última gravação que esta aba conhece: o que mudou aqui desde então fica como está aqui (ainda vai ser gravado);
// o resto fica como está gravado, inclusive o que a outra aba excluiu. Se os dois lados mudaram o mesmo item,
// fica a versão editada por último
function juntarAbas(aqui,veio,conhecidas){
 const apagadas=new Map();
 aqui.apagadas.concat(veio.apagadas).forEach(a=>{if(!(apagadas.get(a.id)>=a.ua))apagadas.set(a.id,a.ua)});
 const mudou=x=>conhecidas.get(x.id)!==x.ua;
 const depoisDaExclusao=x=>(x.ua||0)>(apagadas.get(x.id)||0);
 const juntar=(meus,deLa)=>{
  const porId=new Map(meus.map(x=>[x.id,x]));
  const out=[];
  deLa.forEach(x=>{
   const meu=porId.get(x.id);
   porId.delete(x.id);
   // não está aqui: é novo lá, ou foi excluído aqui (aí só volta se foi editado lá depois da exclusão)
   if(!meu){if(!conhecidas.has(x.id)||(mudou(x)&&depoisDaExclusao(x)))out.push(x);return}
   // não mudou aqui: fica o que está gravado (o mesmo objeto, se também não mudou lá)
   if(!mudou(meu)){out.push(meu.ua===x.ua?meu:x);return}
   // mudou aqui: fica o daqui, a não ser que também tenha mudado lá, depois
   out.push(mudou(x)&&(x.ua||0)>(meu.ua||0)?x:meu);
  });
  // os que só estão aqui: criados aqui, ou excluídos lá (aí só ficam se foram editados aqui depois da exclusão)
  porId.forEach(meu=>{if(!conhecidas.has(meu.id)||(mudou(meu)&&depoisDaExclusao(meu)))out.push(meu)});
  return out;
 };
 const paginas=juntar(aqui.notes.concat(aqui.lixeira),veio.notes.concat(veio.lixeira));
 const d={version:aqui.version,notebooks:juntar(aqui.notebooks,veio.notebooks),categories:juntar(aqui.categories,veio.categories),
  notes:paginas.filter(n=>!n.del),lixeira:paginas.filter(n=>n.del)};
 if(!d.notebooks.length)return aqui;
 const vivos=new Set(d.notebooks.concat(d.categories,paginas).map(x=>x.id));
 d.apagadas=[...apagadas].filter(([id])=>!vivos.has(id)).map(([id,ua])=>({id,ua}));
 consertarOrfas(d);
 return d;
}
// traz para esta aba o que outra aba gravou e desenha de novo só o que mudou na tela
function receberDeOutraAba(salvo){
 const veio=salvo.dados;
 ['notebooks','categories','notes','lixeira','apagadas'].forEach(k=>{if(!Array.isArray(veio[k]))veio[k]=[]});
 if(!veio.notebooks.length)return;
 const novo=juntarAbas(DB,veio,Store.conhecidas);
 Store.marca=salvo.marca;
 Store.conhecidas=versoesDe(veio);
 juntarAjustes(salvo.ajustes);
 trocarDados(novo);
}
// troca os dados desta aba pelos que vieram de fora (de outra aba ou do GitHub) e desenha de novo só o que mudou
function trocarDados(novo){
 const meus=new Set(DB.notes.concat(DB.lixeira));
 const aberta=noteById(S.noteId),pinoAntes=objetosDoPino();
 DB=novo;
 // as páginas que vieram de lá ganham o índice de busca (ele não é gravado)
 DB.notes.concat(DB.lixeira).forEach(n=>{if(!meus.has(n))reindexNote(n)});
 // a campanha ou o capítulo abertos podem ter sido excluídos na outra aba
 if(!DB.notebooks.some(b=>b.id===S.nb)){S.nb=DB.notebooks[0].id;S.hist=[];S.filters=[];applyView({kind:'rec'})}
 if(S.view.kind==='cat'&&!catById(S.view.id)){const g=inboxCat();applyView({kind:'cat',id:g?g.id:null})}
 renderSidebar();renderList();
 // a página aberta só é desenhada de novo se mudou lá (e volta para o mesmo ponto da rolagem)
 const agora=noteById(S.noteId);
 if($('#pageBody')&&agora!==aberta){
  const rolagem=($('#book .page-scroll')||{}).scrollTop||0;
  if(agora){renderPage(agora);const sc=$('#book .page-scroll');if(sc)sc.scrollTop=rolagem}
  else{S.noteId=null;const f=pickDefaultNote();if(f)openNote(f.id,{skipAnim:true});else renderPage(null)}
 }
 if(S.pinCtx){const p=objetosDoPino();if(p[0]!==pinoAntes[0]||p[1]!==pinoAntes[1])renderPinPanel()}
 else if(S.refId)renderRefPanel();
}
// o mapa e a página do pino que está com o painel aberto
function objetosDoPino(){
 if(!S.pinCtx)return [null,null];
 const m=noteById(S.pinCtx.mapId);
 const p=m&&m.fields.map&&(m.fields.map.pins||[]).find(x=>x.id===S.pinCtx.pinId);
 return [m||null,p?noteById(p.noteId)||null:null];
}
// os avisos de backup e da lixeira valem para o aparelho todo: fica o mais recente das duas abas
function juntarAjustes(deLa){
 if(!deLa||typeof deLa!=='object')return;
 if((deLa.lastExport||0)>(AJUSTES.lastExport||0)){AJUSTES.lastExport=deLa.lastExport;AJUSTES.notesAtExport=deLa.notesAtExport}
 ['backupSnooze','lixeiraSnooze'].forEach(k=>{if((deLa[k]||0)>(AJUSTES[k]||0))AJUSTES[k]=deLa[k]});
}
// pergunta como importar: juntar com o que está aqui (o normal) ou substituir tudo; devolve null se cancelar
function escolherImportacao(paginas){
 return new Promise(res=>{
  let done=false;
  const fin=v=>{if(done)return;done=true;res(v)};
  const msg=soExemplo(DB)
   ?'Este aparelho ainda só tem o exemplo do grimório: ele dá lugar ao conteúdo do backup.'
   :'O backup tem '+paginas+(paginas===1?' página':' páginas')+'. Como trazer para cá?';
  const m=openModal('<div class="m-orn">✦</div><h3 class="m-title">Importar backup</h3><p class="m-msg">'+esc(msg)+'</p>'
   +'<div class="imp-ops">'
   +'<button class="btn btn-bronze imp-b" type="button" data-r="juntar"><b>Juntar</b><small>Mantém o que está aqui e traz o que é novo. Se a mesma página mudou nos dois aparelhos, fica a versão editada por último.</small></button>'
   +'<button class="btn imp-b" type="button" data-r="substituir"><b>Substituir tudo</b><small>Troca todo o conteúdo deste aparelho, inclusive a lixeira, pelo do backup.</small></button>'
   +'</div>'
   +'<div class="m-actions"><button class="btn" type="button" data-r="cancelar">Cancelar</button></div>',
   {onClose:()=>fin(null)});

// "1 página nova", "3 páginas novas"...
function contar(n,um,varios){return n+' '+(n===1?um:varios)}
// "2 páginas novas e 1 atualizada", "1 página atualizada"... (só o que tem)
function resumoDeMudancas(novas,atualizadas){

 if(atualizadas)partes.push(novas?contar(atualizadas,'atualizada','atualizadas'):contar(atualizadas,'página atualizada','páginas atualizadas'));
 return partes.join(' e ');
}

/* --- o que entra de um backup --- */
// um backup pode ter sido mexido fora do grimório: ids, cores, campos e o texto das páginas são conferidos,
// para nada estranho (como um script escondido no texto) entrar e rodar aqui
const ID_OK=/^[\w-]{1,80}$/,COR_OK=/^#[0-9a-f]{3,8}$/i,IMAGEM_OK=/^data:image\/(png|jpe?g|gif|webp);base64,/i;
const idOk=v=>typeof v==='string'&&ID_OK.test(v);
function limparDadosRecebidos(d){
 const itens=a=>Array.isArray(a)?a.filter(x=>x&&typeof x==='object'&&idOk(x.id)):[];
 const textos=a=>Array.isArray(a)?a.filter(x=>typeof x==='string'):[];
 const numeros=x=>['ca','ua','la','ac','del'].forEach(k=>{if(k in x&&typeof x[k]!=='number')delete x[k]});
 d.notebooks=itens(d.notebooks);d.categories=itens(d.categories);
 d.notes=itens(d.notes);d.lixeira=itens(d.lixeira);
 d.apagadas=itens(d.apagadas).filter(a=>typeof a.ua==='number');
 d.notebooks.concat(d.categories).forEach(x=>{
  if(typeof x.name!=='string')x.name='Sem nome';
  numeros(x);
 });
 d.notebooks.forEach(nb=>{
  if(!('capa' in nb))return;
  const c=nb.capa;
  if(c&&typeof c==='object'&&conhece(COUROS,c.couro)&&conhece(EMBLEMAS,c.emblema))nb.capa={couro:c.couro,emblema:c.emblema};else delete nb.capa;
 });
 d.categories.forEach(c=>{
  if(!idOk(c.nb))c.nb='';
  if(!TYPE_META[c.ntype])c.ntype='text';
  if(!Object.prototype.hasOwnProperty.call(I,c.icon))c.icon='leaf';
 });
 d.notes.concat(d.lixeira).forEach(n=>{
  n.html=limparHTML(typeof n.html==='string'?n.html:'');
  if(typeof n.title!=='string')n.title='';
  n.tags=textos(n.tags);n.aliases=textos(n.aliases);n.refs=textos(n.refs).filter(idOk);
  // (backups de antes da versão 5 não têm tagsManuais: a migração separa as tags do texto das manuais)
  if('tagsManuais' in n)n.tagsManuais=textos(n.tagsManuais);
  if(!idOk(n.nb))n.nb='';
  if(n.cat!=null&&!idOk(n.cat))n.cat=null;
  numeros(n);
  // campos da ficha: só textos; o mapa é conferido à parte
  const f=(n.fields&&typeof n.fields==='object')?n.fields:{};
  Object.keys(f).forEach(k=>{if(k!=='map'&&typeof f[k]!=='string')delete f[k]});
  if('map' in f)f.map=limparMapa(f.map);
  n.fields=f;
 });
 if(d.imagens&&typeof d.imagens==='object'){
  Object.keys(d.imagens).forEach(id=>{const v=d.imagens[id];if(!idOk(id)||typeof v!=='string'||!IMAGEM_OK.test(v))delete d.imagens[id]});
 }
 return d;
}
// pinos e traços do mapa: posições em números, cores no formato #rrggbb, ícones que o grimório conhece
function limparMapa(m){
 if(!m||typeof m!=='object')return {imgId:null,pins:[],ops:[]};
 const num=(v,padrao)=>typeof v==='number'&&isFinite(v)?v:padrao;
 const out={imgId:idOk(m.imgId)?m.imgId:null};
 if(typeof m.img==='string'&&IMAGEM_OK.test(m.img))out.img=m.img;   // (imagem de fundo das versões antigas)
 out.pins=(Array.isArray(m.pins)?m.pins:[]).filter(p=>p&&typeof p==='object').map(p=>{
  const q={id:idOk(p.id)?p.id:uid(),x:clamp(num(p.x,.5),0,1),y:clamp(num(p.y,.5),0,1),noteId:idOk(p.noteId)?p.noteId:null,
   color:COR_OK.test(p.color)?p.color:'#7d2b23',icon:Object.prototype.hasOwnProperty.call(I,p.icon)?p.icon:'mapPin'};
  if(typeof p.name==='string')q.name=p.name;   // (pinos das versões antigas, antes de cada um ter a sua página)
  return q;
 });
 out.ops=(Array.isArray(m.ops)?m.ops:[]).filter(o=>o&&typeof o==='object').map(o=>{
  const q={t:typeof o.t==='string'?o.t:'p',c:COR_OK.test(o.c)?o.c:'#2c2013',s:num(o.s,5)};
  if(Array.isArray(o.pts))q.pts=o.pts.filter(pt=>Array.isArray(pt)).map(pt=>[num(pt[0],0),num(pt[1],0)]);
  ['x','y','x0','y0','x1','y1'].forEach(k=>{if(k in o)q[k]=num(o[k],0)});
  if(typeof o.text==='string')q.text=o.text;
  return q;
 });
 return out;
}
// o texto de uma página: ficam só as marcações que o grimório usa (sem scripts, sem "on...", sem endereços javascript:)
const TAGS_OK=new Set('P BR B STRONG I EM U S STRIKE DEL INS MARK SMALL SUB SUP H1 H2 H3 H4 H5 H6 UL OL LI BLOCKQUOTE PRE CODE SPAN DIV IMG HR INPUT A TABLE THEAD TBODY TR TD TH'.split(' '));
const TAGS_FORA=new Set('SCRIPT STYLE IFRAME FRAME FRAMESET OBJECT EMBED APPLET LINK META BASE NOSCRIPT TEMPLATE SVG MATH TEXTAREA SELECT BUTTON FORM AUDIO VIDEO SOURCE TRACK CANVAS TITLE HEAD'.split(' '));
const _limpa=document.createElement('template');
function limparHTML(html){
 if(!html)return '';
 _limpa.innerHTML=html;
 // do fim para o começo: cada elemento é conferido depois dos que estão dentro dele
 [..._limpa.content.querySelectorAll('*')].reverse().forEach(el=>{
  const tag=el.tagName.toUpperCase();
  if(TAGS_FORA.has(tag)||(tag==='INPUT'&&el.getAttribute('type')!=='checkbox')){el.remove();return}
  if(!TAGS_OK.has(tag)){el.replaceWith(...el.childNodes);return}   // marcação desconhecida: fica só o texto dela
  [...el.attributes].forEach(a=>{if(!atributoOk(tag,a.name.toLowerCase(),a.value))el.removeAttribute(a.name)});
 });
 return _limpa.innerHTML;
}
function atributoOk(tag,nome,valor){
 if(nome==='class'||nome==='title'||nome==='data-ref')return true;
 if(nome==='data-id'||nome==='data-img')return ID_OK.test(valor);
 if(nome==='contenteditable')return valor==='false';
 if(nome==='style')return /^[\w\s:;#%.,()-]*$/.test(valor)&&!/url|expression|position|import|behavior/i.test(valor);
 if(tag==='IMG')return nome==='alt'||(nome==='src'&&IMAGEM_OK.test(valor));
 if(tag==='INPUT')return nome==='type'||nome==='checked';
 if(tag==='A')return nome==='href'&&/^(https?:|mailto:)/i.test(valor.trim());
 if(tag==='TD'||tag==='TH')return (nome==='colspan'||nome==='rowspan')&&/^\d{1,2}$/.test(valor);
 if(tag==='OL')return nome==='start'&&/^\d{1,4}$/.test(valor);
 return false;
}

   +(GH.cfg?', e a cópia do GitHub também':'')+'. Se precisar, exporte um backup daqui antes.','Substituir');
  if(!ok)return;
 }
 try{

    :(r.novas||r.atualizadas)?'Backup juntado: '+resumoDeMudancas(r.novas,r.atualizadas)
    :'Nada novo no backup: tudo já estava aqui';
  }else{
   // conectado ao GitHub, o que estava aqui e não está no backup fica registrado como excluído:
   // assim sai também dos outros aparelhos (a não ser que lá tenha sido editado depois)
   if(GH.cfg){
    const agora=Date.now(),ficam=new Set(veio.notebooks.concat(veio.categories,veio.notes,veio.lixeira).map(x=>x.id));
    DB.notebooks.concat(DB.categories,DB.notes,DB.lixeira).forEach(x=>{if(!ficam.has(x.id))veio.apagadas.push({id:x.id,ua:agora})});
   }
   DB=veio;
  }
  gravarJa();   // o que veio do backup vale como está (sem juntar com outra aba antes)
  // continua na mesma campanha e na mesma página, se elas ainda existem
  if(!DB.notebooks.some(b=>b.id===S.nb))S.nb=DB.notebooks[0].id;

  if(f)openNote(f.id,{skipAnim:true});else renderPage(null);

}

/* ===================== sincronização com o GitHub ===================== */
/* As notas continuam guardadas neste aparelho (funciona sem internet). Conectado, o grimório junta de tempos
   em tempos o que tem aqui com a cópia que fica num repositório PRIVADO do GitHub: o arquivo dados.json
   (páginas, capítulos, campanhas, lixeira) e a pasta imagens/ (uma imagem por arquivo). Cada gravação lá
   vira uma versão no histórico do repositório. A chave de acesso fica só neste aparelho: não vai no backup. */
const GH={
 API:'https://api.github.com',
 CHAVE:'grimorioteste_github',                 // {repo, token, aparelho}
 CHAVE_BASE:'grimorioteste_github_base',       // versão de cada página na última sincronização
 ESPERA:20000,                            // pausa depois de escrever, antes de enviar
 cfg:null,estado:'desligado',msg:'',ultima:0,
 ocupado:false,deNovo:false,timer:null,
 enviado:'',sha:null,arquivos:{}   // o que este aparelho sabe que está no GitHub: assinatura, versão do arquivo e imagens
};
function ghLerConfig(){
 try{GH.cfg=JSON.parse(localStorage.getItem(GH.CHAVE))||null}catch(e){GH.cfg=null}
 return GH.cfg;
}
function erroGH(tipo,msg){const e=new Error(msg);e.tipo=tipo;return e}
// pedido à API do GitHub, com a chave deste aparelho (ou com a que está sendo conferida, em op.cfg)
async function ghPedido(caminho,op){
 op=op||{};
 const cfg=op.cfg||GH.cfg;
 const cab={'Authorization':'Bearer '+cfg.token,'Accept':op.aceita||'application/vnd.github+json'};
 if(op.corpo)cab['Content-Type']='application/json';
 try{
  return await fetch(GH.API+caminho,{method:op.metodo||'GET',headers:cab,cache:'no-store',body:op.corpo?JSON.stringify(op.corpo):undefined});
 }catch(e){throw erroGH('offline','Sem internet agora; sincroniza quando a conexão voltar')}
}
// resposta de erro do GitHub numa mensagem que dá para entender
function erroDaResposta(r){
 if(r.status===401)return erroGH('chave','O GitHub recusou a chave de acesso (apagada ou vencida). Gere outra e conecte de novo');
 if(r.status===403&&r.headers.get('x-ratelimit-remaining')==='0')return erroGH('limite','Limite de uso do GitHub atingido; tente de novo daqui a pouco');
 if(r.status===403)return erroGH('permissao','A chave não pode gravar no repositório: em "Contents", escolha "Read and write"');
 if(r.status===404)return erroGH('repo','Repositório não encontrado: confira o nome, ou a chave não tem acesso a ele');
 if(r.status>=500)return erroGH('github','O GitHub não respondeu direito; tente de novo daqui a pouco');
 return erroGH('github','O GitHub respondeu com erro ('+r.status+')');
}
// texto com acentos <-> base64, do jeito que o GitHub guarda os arquivos
function textoParaBase64(texto){
 const bytes=new TextEncoder().encode(texto);
 let bin='';
 for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));
 return btoa(bin);
}
function base64ParaTexto(b64){
 const bin=atob(b64.replace(/\s/g,''));
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder().decode(bytes);
}
// lê um arquivo do repositório: {sha, base64}, ou null se ele ainda não existe.
// "jaTenho" = a versão (sha) que este aparelho já conhece: se é a mesma, o conteúdo não é buscado
async function ghLerArquivo(caminho,jaTenho){
 const r=await ghPedido('/repos/'+GH.cfg.repo+'/contents/'+caminho,{aceita:'application/vnd.github.object+json'});
 if(r.status===404)return null;
 if(!r.ok)throw erroDaResposta(r);
 const j=await r.json();
 if(jaTenho&&j.sha===jaTenho)return {sha:j.sha,base64:null};
 let b64=j.content||'';
 // arquivo com mais de 1 MB vem sem o conteúdo: ele é pedido à parte, pela versão exata (sha)
 if(!b64&&j.size>0){
  const rb=await ghPedido('/repos/'+GH.cfg.repo+'/git/blobs/'+j.sha);
  if(!rb.ok)throw erroDaResposta(rb);
  b64=(await rb.json()).content||'';
 }
 return {sha:j.sha,base64:b64};
}
// grava um arquivo. "sha" é a versão lida antes: se outro aparelho gravou depois, o GitHub recusa (conflito)
async function ghGravarArquivo(caminho,base64,sha,mensagem){
 const corpo={message:mensagem,content:base64};
 if(sha)corpo.sha=sha;
 const r=await ghPedido('/repos/'+GH.cfg.repo+'/contents/'+caminho,{metodo:'PUT',corpo});
 if(r.status===409||r.status===422)throw erroGH('conflito','O arquivo mudou no GitHub enquanto este aparelho gravava');
 if(!r.ok)throw erroDaResposta(r);
 return (await r.json()).content.sha;
}
// a versão de cada item: se a daqui e a de lá são iguais, não há o que enviar
function assinatura(d){
 const partes=d.notebooks.concat(d.categories,d.notes,d.lixeira||[]).map(x=>x.id+':'+x.ua);
 (d.apagadas||[]).forEach(a=>partes.push('-'+a.id+':'+a.ua));
 return partes.sort().join('|');
}
// versão de cada página na última sincronização (para saber o que mudou aqui, lá, ou nos dois)
function ghLerBase(){try{return JSON.parse(localStorage.getItem(GH.CHAVE_BASE))||null}catch(e){return null}}
function ghGravarBase(d){
 const base={};
 d.notes.concat(d.lixeira).forEach(n=>{base[n.id]=n.ua});
 try{localStorage.setItem(GH.CHAVE_BASE,JSON.stringify(base))}catch(e){}
}
function horaDe(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
// a mesma página mudou aqui e lá desde a última sincronização: a editada por último fica, e a outra
// vira uma página nova "(versão das HH:MM)", com a tag #conflito, para nada se perder (dá para juntar depois)
function guardarVersoesEmConflito(aqui,veio,base){
 if(!base)return [];
 const daqui=new Map(aqui.notes.concat(aqui.lixeira).map(n=>[n.id,n]));
 const copias=[];
 veio.notes.concat(veio.lixeira).forEach(x=>{
  const meu=daqui.get(x.id);
  if(!meu||meu.ua===x.ua||!(x.id in base)||base[x.id]===meu.ua||base[x.id]===x.ua)return;
  const velha=meu.ua>x.ua?x:meu,nova=velha===x?meu:x;
  // daqui para a frente, essa diferença já está resolvida (uma nova tentativa não faz outra cópia)
  base[x.id]=nova.ua;
  // só o texto conta: mudar só o status ou a estrela não gera cópia, nem a versão que foi para a lixeira
  if(velha.del||velha.type==='map'||plain(velha.html)===plain(nova.html))return;
  const copia=JSON.parse(JSON.stringify(velha));
  delete copia.del;delete copia.text;
  Object.assign(copia,{id:uid(),title:(velha.title||'Sem título')+' (versão das '+horaDe(velha.ua)+')',pin:false,
   aliases:[],tagsManuais:(copia.tagsManuais||[]).concat('conflito'),ca:Date.now(),ua:Date.now(),la:Date.now()});
  atualizarTags(copia,'');reindexNote(copia);
  aqui.notes.push(copia);copias.push(copia);
 });
 try{localStorage.setItem(GH.CHAVE_BASE,JSON.stringify(base))}catch(e){}
 return copias;
}
// faz uma sincronização: lê o que está no GitHub, junta com o daqui, envia o que é novo
async function ghUmaVez(){
 const arq=await ghLerArquivo('dados.json',GH.sha);
 // ninguém gravou lá desde a última vez que este aparelho leu ou gravou: não precisa ler de novo
 const igualLa=!!arq&&arq.sha===GH.sha;
 let remoto=null,assinaturaRemota=GH.enviado;
 if(arq&&!igualLa){
  try{remoto=JSON.parse(base64ParaTexto(arq.base64))}catch(e){throw erroGH('github','O arquivo dados.json no GitHub está estragado')}
  if(!remoto||typeof remoto!=='object')throw erroGH('github','O arquivo dados.json no GitHub está estragado');
  ['notebooks','categories','notes','lixeira','apagadas'].forEach(k=>{if(!Array.isArray(remoto[k]))remoto[k]=[]});
  if((remoto.version||0)>DB.version)throw erroGH('versao','As notas no GitHub são de uma versão mais nova do grimório: recarregue esta página');
  assinaturaRemota=assinatura(remoto);
 }
 const deLa=igualLa?GH.arquivos:(remoto&&remoto.arquivosDeImagem&&typeof remoto.arquivosDeImagem==='object'?remoto.arquivosDeImagem:{});
 const arquivos=Object.assign({},deLa);
 // 1. o que veio de lá entra aqui (o exemplo que vem com o grimório não conta)
 let veio={novas:0,atualizadas:0},copias=[],mudouAqui=false;
 if(remoto&&!soExemplo(remoto)){
  const dados=paraJuntar(remoto);
  copias=guardarVersoesEmConflito(DB,dados,ghLerBase());
  veio=juntarDados(DB,dados);
  mudouAqui=veio.trocouExemplo||veio.novas||veio.atualizadas||copias.length||assinatura(veio.dados)!==assinatura(DB);
  if(mudouAqui)trocarDados(veio.dados);
 }
 // 2. imagens daqui que ainda não estão lá
 for(const id of imagensUsadas(DB)){
  if(arquivos[id]||!idOk(id))continue;
  const reg=await Imagens.ler(id);
  const m=reg&&/^data:image\/(png|jpe?g|gif|webp);base64,(.*)$/i.exec(reg.dado);
  if(!m)continue;
  const caminho='imagens/'+id+'.'+m[1].toLowerCase().replace('jpeg','jpg');
  try{await ghGravarArquivo(caminho,m[2],null,'Grimório · imagem · '+GH.cfg.aparelho)}
  catch(e){if(e.tipo!=='conflito')throw e}   // (conflito aqui = a imagem já está lá)
  arquivos[id]=caminho;
 }
 // 3. os dados, se o daqui é diferente do de lá (só o exemplo que vem com o grimório não é enviado)
 const local=Object.assign(semIndice(DB),{arquivosDeImagem:arquivos});
 const imagensNovas=Object.keys(arquivos).length!==Object.keys(deLa).length;
 let sha=arq&&arq.sha;
 if(!soExemplo(DB)&&(!arq||imagensNovas||assinatura(local)!==assinaturaRemota)){
  const quando=new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
  sha=await ghGravarArquivo('dados.json',textoParaBase64(JSON.stringify(local)),sha,'Grimório · '+GH.cfg.aparelho+' · '+quando);
  ghGravarBase(local);
 }else if(remoto)ghGravarBase(local);
 // o que está no GitHub agora (o que mudar aqui depois disso vai na próxima vez)
 GH.sha=sha||null;GH.arquivos=arquivos;
 GH.enviado=assinatura(local);
 if(mudouAqui)flushSave();   // o que chegou fica gravado neste aparelho
 // 4. imagens de lá que faltam aqui
 let baixadas=0;
 for(const id of imagensUsadas(DB)){
  if(!arquivos[id]||await Imagens.tem(id))continue;
  const a=await ghLerArquivo(arquivos[id]);
  if(!a)continue;
  const ext=arquivos[id].split('.').pop();
  await Imagens.guardar('data:image/'+(ext==='jpg'?'jpeg':ext)+';base64,'+a.base64.replace(/\s/g,''),id);
  baixadas++;
 }
 if(baixadas)mostrarImagensBaixadas();
 // avisos
 if(copias.length)toast(contar(copias.length,'página foi mudada','páginas foram mudadas')+' nos dois aparelhos: a outra versão ficou como “'+copias[0].title+'”'+(copias.length>1?' e mais '+(copias.length-1):''),'warn');
 else if(veio.trocouExemplo)toast('Suas notas do GitHub chegaram');
 else if(veio.novas||veio.atualizadas)toast('Do GitHub: '+resumoDeMudancas(veio.novas,veio.atualizadas));
}
// prepara o que veio do GitHub para juntar: as páginas iguais às daqui (mesma versão) ficam como estão;
// só as outras passam pela conferência de backup e pela atualização de versão (bem mais rápido com muitas páginas)
function paraJuntar(remoto){
 const daqui=new Map(DB.notes.concat(DB.lixeira).map(n=>[n.id,n]));
 const iguais=[];
 const separar=lista=>lista.filter(x=>{
  const m=x&&daqui.get(x.id);
  if(m&&m.ua===x.ua&&!!m.del===!!x.del){iguais.push(m);return false}
  return true;
 });
 remoto.notes=separar(remoto.notes);
 remoto.lixeira=separar(remoto.lixeira);
 const dados=migrate(limparDadosRecebidos(remoto));
 iguais.forEach(m=>(m.del?dados.lixeira:dados.notes).push(m));
 return dados;
}

// sincroniza agora (se já está sincronizando, faz de novo logo depois)
async function ghSincronizar(motivo){
 if(!GH.cfg||!DB)return;
 if(GH.ocupado){GH.deNovo=true;return}
 clearTimeout(GH.timer);GH.timer=null;
 if(!navigator.onLine){ghEstado('offline','Sem internet agora; sincroniza quando a conexão voltar');return}
 GH.ocupado=true;
 ghEstado('sincronizando');
 try{
  flushPinNoteEdit();
  // se outro aparelho gravou no meio, lê de novo e junta outra vez
  for(let tentativa=1;;tentativa++){
   try{await ghUmaVez();break}
   catch(e){if(e.tipo!=='conflito'||tentativa>=4)throw e}
  }
  GH.ultima=Date.now();
  ghEstado('ok');
 }catch(e){
  // o aviso aparece no botão "Sincronizar agora" e na primeira vez de cada problema (não a cada pausa)
  const novo=GH.msg!==e.message;
  ghEstado(e.tipo==='offline'?'offline':'erro',e.message);
  if(motivo==='botao'||(novo&&e.tipo!=='offline'&&motivo!=='saindo'))toast(e.message,'warn');
 }finally{
  GH.ocupado=false;
  if(GH.deNovo){GH.deNovo=false;ghAgendar(1500)}
 }
}
function ghAgendar(ms){
 if(!GH.cfg)return;
 clearTimeout(GH.timer);
 GH.timer=setTimeout(()=>ghSincronizar('pausa'),ms);
}
// depois de gravar aqui: se algo mudou desde a última sincronização, envia depois de uma pausa

}

function ghSeFazTempo(ms){

}

async function ghConferir(cfg){

// janela do GitHub: conectar este aparelho, ou ver como está e sincronizar
function abrirJanelaGitHub(){
 if(!GH.cfg){
  const m=openModal('<div class="m-orn">✦</div><h3 class="m-title">Usar em vários aparelhos</h3>'
   +'<p class="m-msg">As notas continuam neste aparelho e também vão para um repositório <b>privado</b> seu no GitHub. A Ajuda explica como criar o repositório e a chave.</p>'
   +'<div class="m-body">'
   +'<label class="m-fld"><span>Repositório</span><input id="ghRepo" placeholder="usuario/grimorio-dados" spellcheck="false" autocomplete="off"></label>'
   +'<label class="m-fld"><span>Chave de acesso</span><input id="ghToken" type="password" placeholder="github_pat_…" spellcheck="false" autocomplete="off"></label>'
   +'<label class="m-fld"><span>Nome deste aparelho</span><input id="ghAparelho" placeholder="PC, Celular…" spellcheck="false" autocomplete="off"></label>'
   +'<p class="gh-erro" id="ghErro" hidden></p></div>'
   +'<div class="m-actions"><button class="btn" type="button" data-r="0">Cancelar</button><button class="btn btn-bronze" type="button" id="ghConectar">Conectar</button></div>',{});
  m.el.classList.add('m-github');
  // (os campos são procurados dentro desta janela: uma janela anterior ainda pode estar sumindo da tela)
  const campo=id=>m.el.querySelector('#'+id);
  // o cursor vai para o primeiro campo, se a pessoa ainda não tocou em outro
  setTimeout(()=>{if(!m.el.contains(document.activeElement))campo('ghRepo').focus()},70);
  const erro=t=>{const p=campo('ghErro');p.textContent=t;p.hidden=!t};
  const conectar=async()=>{
   const repo=norm(campo('ghRepo').value).replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$|\/$/g,'');
   const token=campo('ghToken').value.trim();
   const aparelho=norm(campo('ghAparelho').value)||'aparelho';
   if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){erro('Escreva o repositório como usuario/nome');return}
   if(!token){erro('Cole a chave de acesso');return}
   const b=campo('ghConectar');b.disabled=true;b.textContent='Conferindo…';erro('');
   try{await ghConferir({repo,token,aparelho})}
   catch(e){erro(e.message);b.disabled=false;b.textContent='Conectar';return}
   m.close();
   ghConectar({repo,token,aparelho});
  };
  campo('ghConectar').addEventListener('click',conectar);
  m.el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();conectar()}});

  return;
 }
 const situacao={ok:'Sincronizado às '+horaDe(GH.ultima||Date.now())+'.',sincronizando:'Sincronizando agora…',
  offline:'Sem internet: as notas estão salvas aqui e vão quando a conexão voltar.',erro:GH.msg,desligado:''}[GH.estado]||'';
 const m=openModal('<div class="m-orn">✦</div><h3 class="m-title">GitHub</h3>'
  +'<p class="m-msg">'+esc(situacao)+'</p>'

  +'<button class="btn btn-bronze" type="button" data-r="sinc">Sincronizar agora</button></div>',{});

 try{localStorage.getItem('x')}catch(e){local=false}

function compressImage(file,maxDim,q){
 return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
   URL.revokeObjectURL(url);
   let w=img.naturalWidth,h=img.naturalHeight;
   if(!w||!h){rej();return}
   const sc=Math.min(1,maxDim/Math.max(w,h));
   w=Math.round(w*sc);h=Math.round(h*sc);
   const cv=document.createElement('canvas');cv.width=w;cv.height=h;
   cv.getContext('2d').drawImage(img,0,0,w,h);
   let out;
   if(file.type==='image/png'){
    out=cv.toDataURL('image/png');
    if(out.length>900000)out=cv.toDataURL('image/jpeg',q);
   }else out=cv.toDataURL('image/jpeg',q);
   res(out);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};
  img.src=url;
 });
}

function renderTags(n){
 const row=$('#tagsRow');if(!row)return;
 const manuais=new Set((n.tagsManuais||[]).map(keyOf));
 row.innerHTML=(n.tags||[]).map(t=>manuais.has(keyOf(t))
  ?'<span class="tag-chip"><button class="tc-go" data-t="'+esc(t)+'">#'+esc(t)+'</button><button class="tc-x" data-t="'+esc(t)+'" title="Remover">×</button></span>'
  :'<span class="tag-chip do-texto" title="Escrita no texto: apague o #'+esc(t)+' para tirar"><button class="tc-go" data-t="'+esc(t)+'">#'+esc(t)+'</button></span>'
 ).join('')+'<input class="tag-in" id="tagIn" placeholder="+ tag" spellcheck="false" autocomplete="off">'
 +'<div class="tsug" id="tagSug" hidden></div>';
 const inp=$('#tagIn'),sug=$('#tagSug');
 let sugList=[],sugIdx=-1;
 const closeSug=()=>{sug.hidden=true;sug.innerHTML='';sugList=[];sugIdx=-1};
 const paintSug=()=>{
  sug.innerHTML=sugList.map((t,i)=>'<button class="tsug-i'+(i===sugIdx?' on':'')+'" data-tag="'+esc(t.label)+'" type="button">#'+esc(t.label)+'<span class="tsug-n">'+t.count+'</span></button>').join('');
  sug.hidden=false;
 };
 const updateSug=()=>{
  const q=norm(inp.value).replace(/^#+/,'');
  if(!q){closeSug();return}
  sugList=allTags().filter(t=>keyOf(t.label).startsWith(keyOf(q))&&!(n.tags||[]).some(x=>keyOf(x)===keyOf(t.label))).slice(0,6);
  if(!sugList.length){closeSug();return}
  sugIdx=0;paintSug();
 };
 const commit=(forceVal)=>{
  let v=norm(forceVal!==undefined?forceVal:inp.value).replace(/^#+/,'');
  inp.value='';closeSug();
  if(!v)return;
  n.tagsManuais=n.tagsManuais||[];
  if(!n.tagsManuais.some(t=>keyOf(t)===keyOf(v))){
   n.tagsManuais.push(v);persistNote(n);renderTags(n);
   const ni=$('#tagIn');if(ni)ni.focus();
  }
 };
 inp.addEventListener('input',updateSug);
 inp.addEventListener('keydown',e=>{
  if(sugList.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
   e.preventDefault();
   sugIdx=e.key==='ArrowDown'?Math.min(sugIdx+1,sugList.length-1):Math.max(sugIdx-1,0);
   paintSug();return;
  }
  if(e.key==='Enter'||e.key===','){
   e.preventDefault();
   commit(sugList.length&&sugIdx>=0?sugList[sugIdx].label:undefined);
   return;
  }
  if(e.key==='Escape'&&sugList.length){e.preventDefault();e.stopPropagation();closeSug();return}
  if(e.key==='Backspace'&&!inp.value&&(n.tagsManuais||[]).length){
   n.tagsManuais.pop();persistNote(n);renderTags(n);
   const ni=$('#tagIn');if(ni)ni.focus();
  }
 });
 sug.addEventListener('mousedown',e=>{
  e.preventDefault();
  const b=e.target.closest('[data-tag]');if(!b)return;
  commit(b.dataset.tag);
 });
 inp.addEventListener('blur',()=>{setTimeout(closeSug,150);commit()});
}

// páginas cujo título (ou nome antigo) combina com o que foi digitado depois de [[;
// no fim entra a opção de criar uma referência nova, se o nome ainda não existe
function sugestoesDeNomes(parcial,excetoId){
 const q=semAcento(norm(parcial));
 const paginas=DB.notes.filter(n=>n.nb===S.nb&&n.id!==excetoId&&norm(n.title));
 // fichas e referências antes de sessões, e sessões antes de páginas comuns
 const tipo=n=>n.type==='text'?2:n.type==='session'?1:0;
 let lista;
 if(!q){
  lista=paginas.slice().sort((a,b)=>(b.la||0)-(a.la||0)).slice(0,6).map(n=>({nota:n,nome:n.title}));
 }else{
  const achadas=[];
  paginas.forEach(n=>{
   const t=semAcento(norm(n.title));
   // vale o começo do título ou o começo de qualquer palavra dele (ou de um nome antigo)
   let p=t===q?0:t.startsWith(q)?1:t.split(' ').some(w=>w.startsWith(q))?2:-1;
   if(p<0&&(n.aliases||[]).some(a=>semAcento(norm(a)).startsWith(q)))p=3;
   if(p>=0)achadas.push({nota:n,nome:n.title,p});
  });
  lista=achadas.sort((a,b)=>a.p-b.p||tipo(a.nota)-tipo(b.nota)||(b.nota.la||0)-(a.nota.la||0)).slice(0,6);
  if(!paginaPeloNome(parcial))lista.push({nota:null,nome:norm(parcial)});
 }
 return lista;
}

/* --- citações: frase de cada citação e menções sem [[ ]] --- */
const LIMITE_CITACOES=40,LIMITE_MENCOES=20;
// trecho do texto em volta de ini..fim, com essa parte destacada
function trechoComDestaque(texto,ini,fim){
 let a=Math.max(0,ini-70),b=Math.min(texto.length,fim+90);
 // corta em espaços, para o trecho não começar nem terminar no meio de uma palavra
 if(a>0){const e=texto.indexOf(' ',a);if(e>=0&&e<ini)a=e+1}
 if(b<texto.length){const e=texto.lastIndexOf(' ',b);if(e>fim)b=e}
 return (a>0?'…':'')+esc(texto.slice(a,ini))+'<mark>'+esc(texto.slice(ini,fim))+'</mark>'+esc(texto.slice(fim,b))+(b<texto.length?'…':'');
}
// frase em que a nota cita a página (o parágrafo ou item de lista da primeira citação)
const _tq=document.createElement('template');
function fraseDaCitacao(nota,alvoId){
 _tq.innerHTML='<div>'+(nota.html||'')+'</div>';
 const raiz=_tq.content.firstElementChild;
 const span=raiz.querySelector('.wiki-ref[data-id="'+alvoId+'"]');
 if(!span)return '';
 const nome=span.textContent,marca='';
 const bloco=span.closest('p,li,h1,h2,h3,blockquote,pre,.cl,td,th')||raiz;
 span.replaceWith(marca);
 const texto=plain(bloco.innerHTML);
 const i=texto.indexOf(marca);
 if(i<0)return '';
 return trechoComDestaque(texto.slice(0,i)+nome+texto.slice(i+1),i,i+nome.length);
}
// nomes pelos quais a página pode ser mencionada (título e nomes antigos), sem acento, do maior para o menor
function nomesDaPagina(p){
 const lista=[p.title,...(p.aliases||[])].map(x=>semAcento(norm(x))).filter(x=>x.length>=3);
 return [...new Set(lista)].sort((a,b)=>b.length-a.length);
}
// texto simples da nota sem os nomes que já são referência (de qualquer página)
const _sr=document.createElement('template');
function textoSemReferencias(html){
 _sr.innerHTML=html||'';
 _sr.content.querySelectorAll('.wiki-ref').forEach(e=>e.remove());
 return plain(_sr.innerHTML);
}
// acha "nome" (já sem acento) no texto como palavra inteira; devolve a posição no texto original
function acharNome(texto,nome){
 const m=mapaSemAcento(texto);
 const letra=/[\p{L}\p{N}]/u;
 let k=m.base.indexOf(nome);
 while(k>=0){
  const ini=m.origem[k],fim=m.origem[k+nome.length-1]+1;
  if(!letra.test(texto[ini-1]||' ')&&!letra.test(texto[fim]||' '))return{ini,fim};
  k=m.base.indexOf(nome,k+1);
 }
 return null;
}
// notas que falam da página sem marcar o nome com [[ ]] (as mais recentes primeiro)
function mencoesSemLink(alvo){
 const nomes=nomesDaPagina(alvo);
 if(!nomes.length)return[];
 const candidatas=DB.notes.filter(n=>n.nb===alvo.nb&&n.id!==alvo.id&&!(n.refs||[]).includes(alvo.id)
  &&nomes.some(x=>(n.text||'').includes(x))).sort((a,b)=>b.ua-a.ua);
 const out=[];
 for(const n of candidatas){
  const texto=textoSemReferencias(n.html);
  for(const x of nomes){
   const pos=acharNome(texto,x);
   if(pos){out.push({nota:n,frase:trechoComDestaque(texto,pos.ini,pos.fim)});break}
  }
  if(out.length>=LIMITE_MENCOES)break;
 }
 return out;
}
// marca como referência a primeira menção do nome da página dentro da nota
function ligarMencao(nota,alvo){
 _sr.innerHTML=nota.html||'';
 const nomes=nomesDaPagina(alvo);
 const andar=document.createTreeWalker(_sr.content,NodeFilter.SHOW_TEXT);
 let no;
 while((no=andar.nextNode())){
  if(no.parentElement&&no.parentElement.closest('.wiki-ref'))continue;
  for(const x of nomes){
   const pos=acharNome(no.textContent,x);
   if(!pos)continue;
   const nome=no.splitText(pos.ini);   // "nome" começa onde o nome começa
   nome.splitText(pos.fim-pos.ini);    // e termina onde o nome termina
   nome.replaceWith(makeRefSpan(nome.textContent,alvo.id));
   nota.html=_sr.innerHTML;
   persistNote(nota);
   return true;
  }
 }
 return false;
}

// as duas listas de uma página: quem cita com [[ ]] e quem menciona sem ligação
// (devolve '' quando não há nenhuma e "esconderVazio" é verdadeiro; "semMencoes" mostra só as citações)
function citacoesHTML(alvo,todas,esconderVazio,semMencoes){
 const bl=backlinksFor(alvo.id,alvo.id);
 const men=semMencoes?[]:mencoesSemLink(alvo);

  +'<div class="rp-list rp-lig">'+(bl.length?mostrar.map(x=>blItemHTML(x,fraseDaCitacao(x,alvo.id))).join(''):'<div class="rp-empty">Ainda não citada em outras páginas.</div>')+'</div>';
 if(bl.length>mostrar.length)h+='<button class="rp-mais" type="button" data-todas="1">Mostrar todas as '+bl.length+'</button>';
 if(men.length){
  h+='<div class="rp-bl-h">Menções sem ligação · '+men.length+(men.length>=LIMITE_MENCOES?'+':'')+'</div>'
   +'<div class="rp-list rp-mens">'+men.map(m=>'<div class="rp-men">'+blItemHTML(m.nota,m.frase,true)
   +'<button class="btn rp-ligar" type="button" data-ligar="'+m.nota.id+'" title="Marcar o nome como referência nessa página">Ligar</button></div>').join('')+'</div>';
 }
 return h;
}
// cliques nas listas de citações: abrir a nota, ligar uma menção, mostrar todas
function ligarEventosCitacoes(host,alvo,redesenhar){
 host.querySelectorAll('.rp-i').forEach(b=>b.addEventListener('click',()=>gotoNote(b.dataset.n)));
 host.querySelectorAll('[data-ligar]').forEach(b=>b.addEventListener('click',()=>{

  if(nota&&ligarMencao(nota,alvo)){

/* ===================== motor de desenho (compartilhado) ===================== */
/* ops normalizados 0..1 em relação a W,H do alvo — reaproveitado pelo anotador de
   imagens e pelo modo Mapa, cada um decidindo a escala real na hora de desenhar. */
function drawOps(ctx,W,H,ops){
 (ops||[]).forEach(op=>{
  const lw=Math.max(1.2,(op.s||5)*W/1000);
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';
  if(op.t==='p'||op.t==='e'){
   if(!op.pts||!op.pts.length){ctx.restore();return}
   ctx.lineWidth=op.t==='e'?lw*2.6:lw;
   if(op.t==='e')ctx.globalCompositeOperation='destination-out';
   else ctx.strokeStyle=op.c||'#2c2013';
   ctx.beginPath();
   op.pts.forEach((pt,i)=>{const x=pt[0]*W,y=pt[1]*H;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
   if(op.pts.length===1){const x=op.pts[0][0]*W,y=op.pts[0][1]*H;ctx.lineTo(x+.01,y+.01)}
   ctx.stroke();
  }else if(op.t==='r'){
   ctx.strokeStyle=op.c||'#2c2013';ctx.lineWidth=lw;
   const x0=op.x0*W,y0=op.y0*H,x1=op.x1*W,y1=op.y1*H;
   ctx.strokeRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0));
  }else if(op.t==='o'){
   ctx.strokeStyle=op.c||'#2c2013';ctx.lineWidth=lw;
   const x0=op.x0*W,y0=op.y0*H,x1=op.x1*W,y1=op.y1*H;
   const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=Math.max(1,Math.abs(x1-x0)/2),ry=Math.max(1,Math.abs(y1-y0)/2);
   ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
  }else if(op.t==='a'){
   ctx.strokeStyle=op.c||'#2c2013';ctx.fillStyle=op.c||'#2c2013';ctx.lineWidth=lw;
   const x0=op.x0*W,y0=op.y0*H,x1=op.x1*W,y1=op.y1*H;
   ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
   const ang=Math.atan2(y1-y0,x1-x0),hl=Math.max(9,lw*3.2);
   ctx.beginPath();ctx.moveTo(x1,y1);
   ctx.lineTo(x1-hl*Math.cos(ang-.42),y1-hl*Math.sin(ang-.42));
   ctx.lineTo(x1-hl*Math.cos(ang+.42),y1-hl*Math.sin(ang+.42));
   ctx.closePath();ctx.fill();
  }else if(op.t==='t'){
   const fs=Math.max(11,(12+(op.s||5)*4)*W/1000);
   ctx.font='600 '+fs+'px Georgia, serif';ctx.textBaseline='top';
   const x=op.x*W,y=op.y*H,txt=op.text||'',pad=Math.max(3,fs*.28);
   const tw=ctx.measureText(txt).width;
   ctx.fillStyle='#f6ecd4e6';ctx.fillRect(x-pad,y-pad,tw+pad*2,fs*1.35+pad*1.2);
   ctx.fillStyle=op.c||'#2c2013';ctx.fillText(txt,x,y);
  }
  ctx.restore();
 });
}

/* ===================== zoom / navegação ===================== */
let _view={zoom:1,tx:0,ty:0,baseW:0,baseH:0};
function worldToScreen(nx,ny){
 return{x:nx*_view.baseW*_view.zoom+_view.tx,y:ny*_view.baseH*_view.zoom+_view.ty};
}
function screenToWorld(sx,sy){
 return{x:clamp((sx-_view.tx)/(_view.baseW*_view.zoom),0,1),y:clamp((sy-_view.ty)/(_view.baseH*_view.zoom),0,1)};
}
function viewClamp(){
 _view.zoom=clamp(_view.zoom,MAP_MIN_ZOOM,MAP_MAX_ZOOM);
 const ww=_view.baseW*_view.zoom,wh=_view.baseH*_view.zoom;
 const minTx=Math.min(0,_view.baseW-ww);
 _view.tx=clamp(_view.tx,minTx,0);
 const minTy=Math.min(0,_view.baseH-wh);
 _view.ty=clamp(_view.ty,minTy,0);
}
function positionPins(n){
 const host=$('#mapPins');if(!host)return;
 const sw=_view.baseW;
 (n.fields.map.pins||[]).forEach(p=>{
  const el=host.querySelector('[data-id="'+p.id+'"]');if(!el)return;
  const sp=worldToScreen(p.x,p.y);
  el.style.transform='translate('+sp.x.toFixed(1)+'px,'+sp.y.toFixed(1)+'px)';
  el.classList.toggle('mp-flip',sp.x>sw-165);
 });
}
function applyMapView(n){
 const world=$('#mapWorld');
 if(world)world.style.transform='translate('+_view.tx.toFixed(1)+'px,'+_view.ty.toFixed(1)+'px) scale('+_view.zoom.toFixed(4)+')';
 positionPins(n);
 const zin=$('#zcIn'),zout=$('#zcOut');
 if(zin)zin.disabled=_view.zoom>=MAP_MAX_ZOOM-.001;
 if(zout)zout.disabled=_view.zoom<=MAP_MIN_ZOOM+.001;
}
let _mapZoomDebT=null;
function scheduleCanvasRedraw(n,immediate){
 clearTimeout(_mapZoomDebT);
 if(immediate){resizeCanvasRaster(n);return}
 _mapZoomDebT=setTimeout(()=>resizeCanvasRaster(n),160);
}
function resizeCanvasRaster(n){
 const cv=$('#mapCv');if(!cv||!_view.baseW)return;
 const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
 const scale=Math.max(1,_view.zoom)*dpr;
 const w=Math.max(1,Math.round(_view.baseW*scale)),h=Math.max(1,Math.round(_view.baseH*scale));
 if(cv.width===w&&cv.height===h)return;
 cv.width=w;cv.height=h;
 cv.getContext('2d').setTransform(scale,0,0,scale,0,0);
 mapRender(n);
}
function mapRender(n){
 const cv=$('#mapCv');if(!cv)return;
 const ctx=cv.getContext('2d');
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();
 drawOps(ctx,_view.baseW,_view.baseH,n.fields.map.ops);
 if(_mapCur)drawOps(ctx,_view.baseW,_view.baseH,[_mapCur]);
}
function zoomBy(n,factor){
 const stage=$('#mapStage');if(!stage)return;
 const cx=stage.clientWidth/2,cy=stage.clientHeight/2;
 const oldZoom=_view.zoom;
 const newZoom=clamp(oldZoom*factor,MAP_MIN_ZOOM,MAP_MAX_ZOOM);
 const wx=(cx-_view.tx)/(_view.baseW*oldZoom),wy=(cy-_view.ty)/(_view.baseH*oldZoom);
 _view.zoom=newZoom;_view.tx=cx-wx*_view.baseW*newZoom;_view.ty=cy-wy*_view.baseH*newZoom;
 viewClamp();applyMapView(n);scheduleCanvasRedraw(n);
}
function resetView(n){
 _view.zoom=1;_view.tx=0;_view.ty=0;
 applyMapView(n);scheduleCanvasRedraw(n,true);
}

 }).join('');

function findPinAt(n,sx,sy){
 const pins=n.fields.map.pins||[];
 const R=22;let best=null,bestD=Infinity;
 for(const p of pins){
  if(naLixeira(p.noteId))continue;
  const sp=worldToScreen(p.x,p.y);
  const d=Math.hypot(sx-sp.x,sy-(sp.y-18));
  if(d<R&&d<bestD){bestD=d;best=p}
 }
 return best;
}
