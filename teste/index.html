/* ============ fundamentos ============ */
:root{
  --leather-950:#1c110b;
  --leather-900:#241610;
  --leather-800:#2e1c13;
  --leather-700:#3a2519;
  --leather-600:#4a3222;
  --stitch:#c9a06bcc;
  --parch-050:#f9f1de;
  --parch-100:#f6ecd4;
  --parch-200:#efe2c4;
  --parch-300:#e7d5ae;
  --parch-400:#d9c197;
  --parch-500:#c8ac7d;
  --ink:#2c2013;
  --ink-soft:#5c4930;
  --ink-faint:#6b5a3d;
  --bronze:#8c6b3f;
  --bronze-bright:#b6924f;
  --seal:#7d2b23;
  --seal-dark:#5e1f19;
  --f-disp:'Cinzel',Georgia,'Times New Roman',serif;
  --f-body:'EB Garamond',Georgia,'Times New Roman',serif;
  --f-accent:'IM Fell English',Georgia,serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='190' height='190'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --noiseL:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.16'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
*,*::before,*::after{box-sizing:border-box}
/* o atributo hidden sempre esconde, mesmo em elementos com display:flex */
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  font-family:var(--f-body);font-size:16px;color:var(--ink);
  background:var(--leather-950);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::selection{background:#b6924f55}
:focus-visible{outline:2px solid var(--bronze-bright);outline-offset:2px;border-radius:3px}
*{scrollbar-width:thin;scrollbar-color:#8c6b3f80 transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#8c6b3f66;border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic .f{fill:currentColor;stroke:none}
kbd{font:600 .68rem var(--f-disp);letter-spacing:.05em;padding:2px 6px;border:1px solid #b6924f55;border-radius:4px;color:inherit;opacity:.75}

/* ============ layout ============ */
.app{display:grid;grid-template-columns:274px 312px minmax(0,1fr);grid-template-rows:100dvh;height:100dvh}
.topbar{display:none}
.scrim{display:none}

/* ============ capa de couro (sidebar) ============ */
.sidebar{
  position:relative;color:#e9d9ba;overflow:hidden;
  background:
    var(--noiseL),
    radial-gradient(120% 90% at 20% 0%,#4a3222 0%,transparent 55%),
    radial-gradient(140% 110% at 90% 110%,#160d08 0%,transparent 55%),
    linear-gradient(160deg,#3a2519,#2b1a11 60%,#231409);
  box-shadow:inset -14px 0 26px -14px #000, inset 0 0 80px #00000059;
}
.side-in{
  position:absolute;inset:10px;display:flex;flex-direction:column;gap:13px;
  border:2px dashed var(--stitch);border-radius:14px;
  padding:16px 13px 10px;overflow:hidden;
}
.brand{text-align:center;padding:2px 0 0}
.brand-orn{color:var(--bronze-bright);font-size:.78rem;letter-spacing:.6em;text-indent:.6em;opacity:.9}
.brand h1{
  margin:.32rem 0 .18rem;font:600 1.26rem/1.25 var(--f-disp);letter-spacing:.06em;color:#ecdcbb;
  text-shadow:0 1px 0 #00000090, 0 -1px 0 #ffffff12;
}
.brand-sub{font:italic 400 .86rem var(--f-accent);color:#b6924f;letter-spacing:.04em}
.nb-row{display:flex;gap:6px;align-items:center}
.nb-row select{
  flex:1;min-width:0;appearance:none;-webkit-appearance:none;
  background:#00000038 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m7 10 5 5 5-5' fill='none' stroke='%23b6924f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 8px center/14px no-repeat;
  border:1px solid #b6924f45;border-radius:8px;color:#ecdcbb;
  font:600 .82rem var(--f-disp);letter-spacing:.03em;padding:8px 28px 8px 10px;cursor:pointer;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
}
.nb-row select option{background:#2e1c13;color:#ecdcbb}
.side-search{
  display:flex;align-items:center;gap:8px;width:100%;
  background:#00000030;border:1px solid #b6924f38;border-radius:9px;
  padding:8px 10px;color:#cdbb94;font-size:.92rem;text-align:left;
  transition:border-color .15s, background .15s;
}
.side-search:hover{border-color:#b6924f7a;background:#00000042}
.side-search span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-search .ic{width:16px;height:16px;color:var(--bronze-bright)}
.views{display:flex;flex-direction:column;gap:2px}
.v-item{
  display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;
  color:#d8c69f;font-size:.95rem;letter-spacing:.01em;text-align:left;
  border:1px solid transparent;transition:background .12s,color .12s;
}
.v-item .ic{color:#b6924fb8;width:17px;height:17px}
.v-item:hover{background:#ffffff0d;color:#f0e2c2}
.v-item.on{background:#b6924f1f;border-color:#b6924f3d;color:#f3e6c6}
.v-item.on .ic{color:var(--bronze-bright)}
.side-sec{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.side-sec-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:2px 6px 2px 9px;color:#b6924f;
  font:600 .7rem var(--f-disp);letter-spacing:.22em;text-transform:uppercase;
}
.side-sec-h::before{content:"";position:absolute}
.cat-list{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:1px;padding-right:2px;margin-right:-4px}
.cat-item{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:6px 6px 6px 9px;border-radius:8px;color:#d8c69f;font-size:.95rem;
  border:1px solid transparent;cursor:pointer;transition:background .12s;
}
.cat-item .ic{color:#b6924fa8;width:17px;height:17px}
.cat-item:hover{background:#ffffff0d}
.cat-item.on{background:#b6924f1f;border-color:#b6924f3d;color:#f3e6c6}
.cat-item.on .ic{color:var(--bronze-bright)}
.cat-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-size:.74rem;color:#b6924f9c;font-variant-numeric:tabular-nums}
.cat-dots{opacity:0;transition:opacity .12s}
.cat-item:hover .cat-dots,.cat-item.on .cat-dots{opacity:.9}
.side-foot{display:flex;flex-wrap:wrap;gap:6px;padding-top:9px;border-top:1px solid #b6924f2e}
.foot-btn{
  flex:1 1 calc(50% - 3px);min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:7px 6px;border:1px solid #b6924f3d;border-radius:8px;
  color:#cdbb94;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .12s,border-color .12s;
}
.foot-btn:hover{background:#ffffff0d;border-color:#b6924f70}
.foot-btn .ic{width:15px;height:15px;color:var(--bronze-bright)}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;color:inherit;flex:0 0 auto;
  transition:background .12s,color .12s;
}
.icon-btn:hover{background:#8a745225}
.icon-btn.sm{width:26px;height:26px}
.icon-btn.sm .ic{width:15px;height:15px}
.sidebar .icon-btn{color:#cdbb94}
.sidebar .icon-btn:hover{background:#ffffff10;color:#f0e2c2}

/* ============ índice (lista de notas) ============ */
.list-pane{
  display:flex;flex-direction:column;min-width:0;
  color:var(--ink);
  background:
    var(--noise),
    linear-gradient(180deg,#e2cfa4,#d9c197 40%,#cdb183);
  box-shadow:inset -10px 0 22px -12px #00000073, inset 10px 0 22px -14px #00000059;
  border-right:1px solid #00000030;
}
.list-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
  padding:16px 14px 10px;border-bottom:1px solid #8a745245;
}
.lh-text{min-width:0}
.list-title{
  display:flex;align-items:center;gap:8px;
  font:600 1.02rem var(--f-disp);letter-spacing:.04em;color:#3f2f1c;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.list-title .ic{color:var(--bronze);width:18px;height:18px}
/* quando o nome do capítulo não cabe ao lado dos botões, os botões descem para a linha de baixo */
.list-head{flex-wrap:wrap;row-gap:8px}
.list-head .lh-actions{margin-left:auto}
.list-sub{font:italic .82rem var(--f-accent);color:var(--ink-faint);margin-top:2px}
.lh-actions{display:flex;gap:4px;flex:0 0 auto}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:8px;font-size:.9rem;
  border:1px solid #8a745266;background:#f6ecd455;color:var(--ink-soft);
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:#f6ecd4a6;border-color:#8a7452a6}
.btn:active{transform:translateY(1px)}
.btn .ic{width:15px;height:15px}
.btn-bronze{background:linear-gradient(180deg,#b6924f,#8c6b3f);border-color:#6d5330;color:#f9f1de;text-shadow:0 1px 0 #00000047;box-shadow:0 1px 0 #ffffff33 inset,0 2px 6px #00000038}
.btn-bronze:hover{background:linear-gradient(180deg,#c19b55,#947143);border-color:#6d5330}
.btn-wax{background:linear-gradient(180deg,#8d352b,#6b241d);border-color:#4c1712;color:#f6e3d2;text-shadow:0 1px 0 #00000059;box-shadow:0 1px 0 #ffffff2b inset,0 2px 6px #00000042}
.btn-wax:hover{background:linear-gradient(180deg,#98392e,#742720)}
.lh-add{font:600 .8rem var(--f-disp);letter-spacing:.05em;padding:8px 11px}
.lh-addm{padding:8px 7px}
.note-list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 22px}
.nl-h{
  margin:14px 4px 6px;font:600 .68rem var(--f-disp);letter-spacing:.22em;
  text-transform:uppercase;color:#8a7452;
}
.nl-h:first-child{margin-top:2px}
.ni{
  display:flex;gap:10px;align-items:flex-start;
  padding:9px 10px;margin-bottom:7px;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6ecd4d4,#efe0c0c7);
  border:1px solid #8a745238;
  box-shadow:0 1px 2px #00000021, 0 3px 7px -4px #00000030;
  transition:transform .1s, box-shadow .12s, border-color .12s;
}
.ni:hover{transform:translateY(-1px);box-shadow:0 2px 4px #00000026,0 6px 12px -6px #00000038;border-color:#8a745270}
.ni.on{border-color:var(--bronze);box-shadow:0 0 0 1px #8c6b3f66, 0 3px 8px -3px #00000042;background:linear-gradient(180deg,#f9f1de,#f2e5c8)}
.ni-ic{margin-top:1px;color:var(--bronze)}
.ni-ic .ic{width:17px;height:17px}
.ni-main{flex:1;min-width:0}
.ni-t{display:flex;align-items:center;gap:6px;font:600 .93rem/1.3 var(--f-disp);letter-spacing:.02em;color:#3a2b19}
.ni-t>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-t .mk{width:12px;height:12px;color:var(--ink-faint)}
.ni-s{margin-top:2px;font-size:.86rem;line-height:1.35;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni-f{display:flex;align-items:center;gap:6px;margin-top:4px;font:italic .76rem var(--f-accent);color:var(--ink-faint)}
.st-dot{flex:none;width:9px;height:9px;border-radius:50%;background:#8a7452;box-shadow:inset 0 0 0 1px #00000030}
.st-and{background:#b6924f}.st-ok{background:#5a7442}.st-fail{background:#8d352b}.st-ab{background:#9a8a6e}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;padding:6px 2px}
.tag-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;font-size:.84rem;
  background:#f6ecd4b8;border:1px solid #8a745259;color:#6d5330;
  transition:background .12s,border-color .12s;
}
.tag-chip:hover{background:#f9f1de;border-color:#8c6b3f}
.tag-chip .ic{width:13px;height:13px}
.tc-n{font-size:.7rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.empty{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:44px 18px;text-align:center;color:var(--ink-faint);
  font:italic 1rem var(--f-accent);
}
.empty .ic{width:34px;height:34px;opacity:.55;stroke-width:1.3}
.empty.big{padding:80px 20px}
.empty.big .ic{width:46px;height:46px}

/* ============ mesa e página encadernada ============ */
.page-pane{
  position:relative;min-width:0;display:flex;overflow:clip;
  background:
    var(--noiseL),
    radial-gradient(90% 70% at 50% 0%,#33200f66 0%,transparent 60%),
    radial-gradient(120% 100% at 50% 115%,#000000b3 0%,transparent 55%),
    linear-gradient(175deg,#241610,#1c110b 70%);
}
.book{flex:1;display:flex;justify-content:center;padding:26px 30px 30px;min-width:0;perspective:1600px}
.page{
  position:relative;width:min(880px,100%);display:flex;
  background:
    var(--noise),
    radial-gradient(120% 90% at 30% 0%,var(--parch-050) 0%,var(--parch-200) 58%,#e0cda3 100%);
  border-radius:6px 12px 12px 6px;
  box-shadow:
    inset 0 0 64px #5a3c1424,
    inset 0 0 5px #5a3c142b,
    inset -2px 0 2px #ffffff59,
    0 22px 46px -12px #000000c4,
    0 4px 12px #00000073;
  transform-origin:left center;
}
.book.turn .page{animation:turnIn .42s cubic-bezier(.22,.75,.25,1)}
@keyframes turnIn{
  from{transform:perspective(1600px) rotateY(-16deg) translateX(16px);opacity:.25;filter:brightness(.94)}
  to{transform:none;opacity:1;filter:none}
}
.spine{
  flex:0 0 26px;border-radius:6px 0 0 6px;position:relative;
  background:
    var(--noiseL),
    linear-gradient(90deg,#2b1a11,#3f2a1b 55%,#241509);
  box-shadow:inset -3px 0 5px #00000080, inset 1px 0 0 #ffffff14;
}
.spine::after{
  content:"";position:absolute;top:10px;bottom:10px;right:4px;
  border-right:2px dashed #c9a06b8c;
}
.spine i{
  position:absolute;left:50%;width:9px;height:9px;margin-left:-6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d9b878,#8c6b3f 55%,#4d3722);
  box-shadow:0 1px 2px #000000a6, inset 0 -1px 1px #00000059;
}
.spine i:nth-child(1){top:9%}.spine i:nth-child(2){top:49%}.spine i:nth-child(3){top:88%}
.page-scroll{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 34px 60px 30px}
.page-empty{align-items:center;justify-content:center}

/* --- cabeçalho da página --- */
.p-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink-soft)}
.m-back{display:none}
.m-back.hist{display:inline-flex}
.p-type{
  display:inline-flex;align-items:center;gap:6px;
  font:600 .68rem var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);
  border:1px solid #8c6b3f59;border-radius:999px;padding:4px 10px;background:#8c6b3f12;
}
.p-type .ic{width:13px;height:13px}
.p-cat{
  appearance:none;-webkit-appearance:none;max-width:180px;
  background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m7 10 5 5 5-5' fill='none' stroke='%238a7452' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 4px center/13px no-repeat;
  border:0;border-bottom:1px dashed #8a745273;border-radius:0;
  font:italic .9rem var(--f-accent);color:var(--ink-soft);
  padding:2px 20px 2px 2px;cursor:pointer;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
}
.save-state{margin-left:auto;font:italic .78rem var(--f-accent);color:var(--ink-faint);opacity:0;transition:opacity .2s}
.save-state.saving,.save-state.saved{opacity:.85}
.save-state.err{opacity:1;color:var(--seal)}
.p-actions{display:flex;gap:2px}
.p-actions .icon-btn{color:var(--ink-faint);width:30px;height:30px}
.p-actions .icon-btn:hover{color:var(--ink-soft)}
.p-actions .icon-btn.on{color:var(--bronze)}
.p-title{
  width:100%;border:0;background:transparent;padding:2px 0 6px;
  font:600 1.9rem/1.2 var(--f-disp);letter-spacing:.015em;color:#33250f;
}
.p-title::placeholder{color:#8a745280;font-style:normal}
.p-title:focus{outline:none}
.orn{color:var(--bronze);opacity:.8;margin:0 0 10px}
.orn svg{width:240px;max-width:70%;height:12px;display:block;stroke:currentColor;fill:none;stroke-width:1.3}
.orn svg .d{fill:currentColor;stroke:none}

/* --- tags da página --- */
.tags-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px;position:relative}
.tsug{
  position:absolute;top:100%;left:0;z-index:20;margin-top:4px;
  min-width:170px;max-width:260px;
  background:var(--noise),linear-gradient(180deg,var(--parch-050),var(--parch-200));
  border:1px solid #8a745273;border-radius:9px;box-shadow:0 10px 26px -8px #000000b3;
  padding:4px;display:flex;flex-direction:column;gap:1px;
}
.tsug-i{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:6px 9px;border-radius:6px;font-size:.88rem;color:var(--ink-soft);text-align:left}
.tsug-i.on,.tsug-i:hover{background:#8c6b3f26;color:#3a2b19}
.tsug-n{font:italic .74rem var(--f-accent);color:var(--ink-faint);flex:0 0 auto}
#hashSug{position:fixed;top:auto;left:auto;margin-top:0}
/* sugestões de nomes ao digitar [[ : no texto da página (perto do cursor) e na captura rápida (embaixo da caixa) */
#refSug{position:fixed;top:auto;left:auto;margin-top:0;max-width:300px}
.tsug.qc-sug{position:static;max-width:none;margin-top:6px}
.tsug-i>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags-row .tag-chip{padding:2px 4px 2px 9px}
/* tag que vem do texto (#tag escrita na página): borda tracejada e sem ×, sai quando o #tag é apagado */
.tags-row .tag-chip.do-texto{padding-right:9px;border-style:dashed;background:#f6ecd466}
.tc-go{color:inherit;font:inherit}
.tc-x{
  width:17px;height:17px;border-radius:50%;line-height:1;font-size:.85rem;color:var(--ink-faint);
  display:inline-flex;align-items:center;justify-content:center;
}
.tc-x:hover{background:#8a745233;color:var(--seal)}
.tag-in{
  border:0;border-bottom:1px dashed #8a745266;background:transparent;
  width:76px;padding:3px 2px;font-size:.86rem;color:var(--ink-soft);
}
.tag-in:focus{outline:none;border-bottom-color:var(--bronze)}
.tag-in::placeholder{color:#8a745299}

/* --- campos de ficha --- */
.fields{
  display:flex;flex-wrap:wrap;gap:8px 18px;
  padding:10px 14px;margin:0 0 14px;
  background:#8c6b3f0d;border:1px solid #8c6b3f38;border-radius:10px;
}
.fld{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:200px}
.fld>span{flex:0 0 auto;white-space:nowrap;font:600 .6rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--bronze)}
.fld input{
  flex:1 1 auto;min-width:0;width:100%;
  border:0;background:transparent;
  padding:0;font-size:.92rem;color:var(--ink);
}
.fld input:focus{outline:none}
.fld-sel{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0}
.fld select{
  appearance:none;-webkit-appearance:none;
  border:0;background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m7 10 5 5 5-5' fill='none' stroke='%238a7452' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right -1px center/12px no-repeat;
  padding:0 16px 0 1px;font-size:.92rem;color:var(--ink);cursor:pointer;
}
.fld select:focus{outline:none}
.fld:focus-within{border-color:var(--bronze)}
.fld-filt{color:var(--ink-faint);flex:0 0 auto;padding:2px}
.fld-filt .ic{width:13px;height:13px}
.fld-filt:hover{color:var(--bronze)}
.fld-filt.hide{display:none}
.filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 14px 2px}
.filt-chip{background:#8c6b3f22;border-left:2px solid var(--bronze);padding-left:8px}
.filt-clear{font:600 .74rem var(--f-disp);letter-spacing:.05em;color:var(--ink-faint);padding:4px 6px;text-decoration:underline}
.filt-clear:hover{color:var(--bronze)}
.backup-bar{
  display:flex;flex-wrap:nowrap;align-items:center;gap:10px;min-width:0;margin:8px 14px 2px;padding:7px 10px 7px 12px;
  background:#8c6b3f14;border-left:2px solid var(--bronze);border-radius:0 8px 8px 0;
}
.backup-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:italic .84rem var(--f-accent);color:var(--ink-soft)}
.backup-bar .backup-exp{
  flex:0 0 auto;font:600 .72rem var(--f-disp);letter-spacing:.04em;
  color:var(--bronze);padding:3px 9px;border-radius:6px;border:1px solid #8a745240;
}
.backup-bar .backup-exp:hover{background:#8c6b3f22}
.backup-x{flex:0 0 auto;color:var(--ink-faint);font-size:1.1rem;line-height:1;padding:2px 4px}
.backup-x:hover{color:var(--bronze)}
/* --- lixeira --- */
.lixeira-bar span{white-space:normal}
.v-count{
  min-width:18px;padding:0 5px;border-radius:999px;line-height:17px;text-align:center;
  background:#b6924f38;color:#f0e2c2;font:600 .66rem var(--f-disp);font-variant-numeric:lining-nums tabular-nums;
}
.v-count:empty{display:none}
.foot-btn.on{background:#b6924f1f;border-color:#b6924f70;color:#f3e6c6}
/* --- GitHub: botão na capa (o pontinho mostra o estado) e a janela de conectar --- */
.foot-gh{flex-basis:100%}
.foot-gh span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.gh-ponto{flex:none;width:7px;height:7px;border-radius:50%;background:#8a7452}
.foot-gh[data-estado="ok"] .gh-ponto{background:#7f9b5a}
.foot-gh[data-estado="sincronizando"] .gh-ponto{background:#d3a84f;animation:ghPisca 1s ease-in-out infinite alternate}
.foot-gh[data-estado="offline"] .gh-ponto{background:#b6924f}
.foot-gh[data-estado="erro"] .gh-ponto{background:#c0503f}
.foot-gh[data-estado="desligado"] .gh-ponto{display:none}
@keyframes ghPisca{to{opacity:.35}}
.gh-erro{margin:2px 0 0;padding:7px 10px;border-radius:8px;background:#7d2b231a;color:#7d2b23;font-size:.92rem;line-height:1.4}
.gh-info{margin:-.4rem 0 1rem;text-align:center;font-size:.92rem;color:var(--ink-soft);overflow-wrap:anywhere}
.m-github .m-actions{flex-wrap:wrap}
.lx-dica{margin:2px 4px 10px;font:italic .84rem var(--f-accent);color:var(--ink-faint)}
.lx-acoes{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.lx-b{gap:5px;padding:3px 7px;font:600 .66rem var(--f-disp);letter-spacing:.02em}
.lx-b .ic{width:12px;height:12px}
.lx-x{color:var(--seal)}
.lx-aviso{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 16px;padding:9px 12px;
  background:#7d2b2312;border-left:2px solid var(--seal);border-radius:0 8px 8px 0;
  font:italic .92rem var(--f-accent);color:var(--ink-soft);
}
.lx-aviso>span{flex:1 1 220px;min-width:0}
.lx-aviso>.ic{color:var(--seal)}
h1.p-title{margin:0}
.lx-campos{margin:0 0 12px;font-size:.95rem;color:var(--ink-soft)}
/* --- pendências --- */
.v-item .v-count{margin-left:auto}
.pd-grupo{margin:0 0 12px}
.pd-pag{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px 5px;text-align:left;
  font:600 .86rem var(--f-disp);letter-spacing:.02em;color:#3a2b19;
}
.pd-pag .ic{width:15px;height:15px;color:var(--bronze)}
.pd-pag span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-pag small{flex:0 0 auto;font:italic .76rem var(--f-accent);letter-spacing:0;color:var(--ink-faint)}
.pd-pag:hover span{text-decoration:underline;text-decoration-color:#8a745266}
.pd-i{
  display:flex;align-items:flex-start;gap:9px;padding:7px 10px;margin:0 0 5px;border-radius:9px;
  background:linear-gradient(180deg,#f6ecd4d4,#efe0c0c7);border:1px solid #8a745238;box-shadow:0 1px 2px #00000021;
}
.pd-ck{width:17px;height:17px;margin:2px 0 0;flex:0 0 auto;cursor:pointer;accent-color:var(--seal)}
.pd-t{flex:1;min-width:0;text-align:left;font-size:.93rem;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.pd-t:hover{color:#6d4a20;text-decoration:underline;text-decoration-color:#8a745266}
.pd-i.feito .pd-t{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:#8a745299}
/* --- tabela e quadro de missões (no lugar da página) --- */
.lh-tab{padding:8px 9px}
.lh-tab.on{border-color:var(--bronze);background:#8c6b3f2e;color:#4d3722}
.tb-modos{display:inline-flex;border:1px solid #8a745259;border-radius:999px;overflow:hidden}
.tb-modos button{padding:4px 11px;font:600 .66rem var(--f-disp);letter-spacing:.06em;color:var(--ink-faint)}
.tb-modos button.on{background:#8c6b3f2e;color:#4d3722}
.tb-resumo{margin:0 0 12px;font:italic .9rem var(--f-accent);color:var(--ink-faint)}
.tb-rolagem{overflow-x:auto;padding-bottom:6px}
.tb-grid{margin:0;font-size:.95rem}
.tb-grid th{padding:0;white-space:nowrap}
.tb-grid th button,.tb-grid th>.tb-rot{
  display:flex;align-items:center;gap:5px;width:100%;padding:.45em .6em;
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left;
}
.tb-grid th button:hover{background:#8c6b3f1a}
.tb-seta{font-size:.7rem;color:var(--bronze)}
.tb-grid tbody tr{cursor:pointer;transition:background .1s}
.tb-grid tbody tr:hover{background:#8c6b3f14}
.tb-nome{font:600 .9rem var(--f-disp);letter-spacing:.02em;color:#3a2b19}
.tb-nome .mk{width:12px;height:12px;margin-left:5px;color:var(--ink-faint)}
.tb-grid .st-dot{display:inline-block;margin-right:6px;vertical-align:0}
.tb-grid td[data-col]{white-space:nowrap}
.tb-page .p-actions{margin-left:auto}
.tb-tags span{font-size:.84rem;color:#6d5330;white-space:nowrap}
.tb-data{white-space:nowrap;font:italic .84rem var(--f-accent);color:var(--ink-faint)}
/* as colunas dividem a largura da página; a que não cabe desce para a linha de baixo (nada fica escondido).
   No celular, uma embaixo da outra */
.quadro{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;padding-bottom:6px}
.qd-col{display:flex;flex-direction:column;gap:7px;min-height:170px;padding:8px;border-radius:10px;background:#8c6b3f12;border:1px dashed #8a745259}
.qd-col.alvo{background:#8c6b3f2a;border-color:var(--bronze)}
.qd-h{display:flex;align-items:flex-start;gap:6px;padding:2px 2px 4px;font:600 .66rem/1.4 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;color:#5c4930}
/* o nome do status quebra a linha quando a coluna é estreita; a conta fica sempre à direita */
.qd-rot{flex:1;min-width:0}
.qd-rot .st-dot{display:inline-block;margin-right:2px;vertical-align:-1px}
.qd-n{margin-left:auto;color:var(--ink-faint)}
.qd-card{
  display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:8px;cursor:grab;
  background:linear-gradient(180deg,#f9f1de,#efe0c0);border:1px solid #8a745240;box-shadow:0 1px 2px #00000021;
}
.qd-card:hover{border-color:#8a745280}
.qd-card.arrastando{opacity:.45}
.qd-card b{font:600 .8rem/1.3 var(--f-disp);letter-spacing:.02em;color:#3a2b19;overflow-wrap:anywhere;hyphens:auto}
.qd-card small{font:italic .8rem var(--f-accent);color:var(--ink-soft)}
.qd-tags{font-size:.78rem;color:#6d5330}
@media (max-width:600px){
  .quadro{grid-template-columns:1fr}
  .qd-col{min-height:0}
}
/* --- organizar (triagem): escolher várias páginas da lista e mover de uma vez --- */
.lh-org{font:italic .82rem var(--f-accent);color:var(--bronze);text-decoration:underline;text-decoration-color:#8c6b3f66;padding:0 1px}
.lh-org:hover{color:#6d4a20}
.ni-ck{display:block;position:relative;width:17px;height:17px;margin-top:1px;border:1.5px solid #8a7452;border-radius:4px;background:#fffaf0b3}
.ni.sel{border-color:var(--bronze);box-shadow:0 0 0 1px #8c6b3f66,0 3px 8px -3px #00000042;background:linear-gradient(180deg,#f9f1de,#f2e5c8)}
.ni.sel .ni-ck{background:var(--seal);border-color:var(--seal)}
.ni.sel .ni-ck::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid #f6e3d2;border-width:0 2px 2px 0;transform:rotate(45deg)}
.org-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #8a745259;background:var(--noise),linear-gradient(180deg,#e7d5ae,#d9c197);box-shadow:0 -8px 16px -12px #00000080;
}
.org-conta{flex:1;min-width:0;font:italic .88rem var(--f-accent);color:var(--ink-soft)}
.org-acoes{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.org-acoes .tb-sel{flex:1;min-width:120px;height:32px}
.org-acoes .btn{padding:6px 10px}
.org-acoes .btn:disabled,.org-acoes .tb-sel:disabled{opacity:.5;pointer-events:none}
body.organizando .fab-cap{display:none}
/* os avisos sobem para não cobrir a barra do modo organizar */
body.organizando #toastRoot{bottom:118px}
/* --- apelidos ("Também chamado de") e "Juntar com…" --- */
.fld-ap{flex:1 1 100%}
.ap-lista{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
.ap-chip{padding:2px 4px 2px 9px}
.ap-in{width:110px}
.rp-apelidos{font:italic .86rem var(--f-accent);color:var(--ink-soft)}
.m-juntar{max-width:470px}
.jn-busca{
  width:100%;margin:2px 0 8px;padding:6px 2px;border:0;border-bottom:1px solid #8a745266;background:transparent;
  font-size:1.02rem;color:var(--ink);
}
.jn-busca:focus{outline:none;border-bottom-color:var(--bronze)}
.jn-lista{display:flex;flex-direction:column;gap:3px;max-height:300px;overflow-y:auto}
.jn-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:8px;text-align:left;border:1px solid transparent}
.jn-i:hover{background:#8c6b3f14;border-color:#8c6b3f42}
.jn-t{flex:1;min-width:0;font:600 .92rem var(--f-disp);color:#3f2f1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jn-motivo{flex:0 0 auto;font:italic .78rem var(--f-accent);color:var(--ink-faint)}
/* imagem guardada à parte ainda carregando (ou que não foi encontrada) */
img.note-img:not([src]){min-height:80px;background:#8c6b3f14}
.fld select.st-sel{
  flex:0 0 auto;width:auto;
  font:600 .66rem var(--f-disp);letter-spacing:.12em;text-transform:uppercase;
  color:#f6ecd4;background-color:#8a7452;border:0;border-radius:999px;
  padding:5px 24px 5px 11px;cursor:pointer;
  box-shadow:inset 0 1px 0 #ffffff2e,0 1px 2px #00000038;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m7 10 5 5 5-5' fill='none' stroke='%23f6ecd4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 6px center;background-size:12px;
}
.fld select.st-sel.st-and{background-color:#8c6b3f}
.fld select.st-sel.st-ok{background-color:#4f6a39}
.fld select.st-sel.st-fail{background-color:#6b241d}
.fld select.st-sel.st-ab{background-color:#7c6e54}

/* --- barra do editor --- */
.tbar{
  position:sticky;top:-23px;z-index:6;
  display:flex;flex-wrap:wrap;align-items:center;gap:2px;
  padding:6px;margin:0 0 10px;border-radius:10px;
  background:linear-gradient(180deg,#f2e6cae6,#e9d9b6e6);
  backdrop-filter:blur(3px);
  border:1px solid #8a745245;box-shadow:0 2px 6px -2px #00000030;
}
.tb{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  min-width:30px;height:30px;padding:0 6px;border-radius:7px;color:var(--ink-soft);
  transition:background .1s,color .1s;
}
.tb:hover{background:#8a745226}
.tb.on{background:#8c6b3f2e;color:#4d3722;box-shadow:inset 0 0 0 1px #8c6b3f59}
.tb b,.tb i,.tb u,.tb s{font-family:var(--f-body);font-size:1rem}
.tb .ic{width:16px;height:16px}
.tb-lbl{font:600 .68rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.tb-sep{width:1px;height:20px;background:#8a745240;margin:0 4px}
.tb-sel{
  appearance:none;-webkit-appearance:none;height:30px;
  border:1px solid #8a745245;border-radius:7px;
  background:#f6ecd47a url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m7 10 5 5 5-5' fill='none' stroke='%238a7452' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 6px center/12px no-repeat;
  padding:0 24px 0 9px;font-size:.88rem;color:var(--ink-soft);cursor:pointer;
}

/* --- corpo do texto --- */
.page-body{
  min-height:240px;outline:none;
  font-size:1.12rem;line-height:1.66;color:var(--ink);
  caret-color:var(--seal);
}
.page-body p,.pp-note p{margin:.35em 0 .75em}
.page-body .versao{margin-top:2.4em;text-align:center;font:italic .9rem var(--f-body);color:var(--ink-faint);font-variant-numeric:lining-nums}
.page-body h1,.page-body h2,.page-body h3,.pp-note h1,.pp-note h2,.pp-note h3{
  font-family:var(--f-disp);color:#3a2b15;letter-spacing:.02em;line-height:1.25;
  margin:1.15em 0 .4em;font-weight:600;
}
.page-body h1{font-size:1.6rem}
.page-body h2{font-size:1.28rem;padding-bottom:.18em;border-bottom:1px solid #8c6b3f40}
.page-body h3{font-size:1.08rem;color:#5c4930}
.pp-note h1{font-size:1.18rem}
.pp-note h2{font-size:1.05rem;padding-bottom:.16em;border-bottom:1px solid #8c6b3f40}
.pp-note h3{font-size:.96rem;color:#5c4930}
.page-body ul,.page-body ol,.pp-note ul,.pp-note ol{margin:.3em 0 .8em;padding-left:1.4em}
.page-body li,.pp-note li{margin:.14em 0}
.page-body ul li::marker,.pp-note ul li::marker{color:var(--bronze)}
.page-body ol li::marker,.pp-note ol li::marker{color:var(--bronze);font-family:var(--f-disp);font-size:.9em}
.page-body blockquote,.pp-note blockquote{
  margin:.9em 0;padding:.35em 1em .35em 1.1em;
  border-left:3px solid var(--bronze);background:#8c6b3f0f;border-radius:0 8px 8px 0;
  font-family:var(--f-accent);font-style:italic;color:#4d3d26;
}
.page-body pre,.pp-note pre{
  margin:.9em 0;padding:.7em .9em;border-radius:8px;overflow-x:auto;
  background:#3a2b1512;border:1px solid #8a745238;
  font:.88rem/1.5 'Courier New',monospace;color:#43331d;white-space:pre-wrap;
}
.page-body a,.pp-note a{color:#6d4a20}
.page-body mark,.pp-note mark{background:#f0d488;color:inherit;border-radius:2px;padding:0 .12em}
.page-body hr,.pp-note hr{border:0;border-top:1px dashed #8a745266;margin:1.2em 0}
.wiki-ref{
  display:inline;padding:.02em .22em;border-radius:4px;cursor:pointer;
  background:linear-gradient(180deg,#b6924f24,#b6924f14);
  border-bottom:1px dotted #8c6b3fb0;color:#6d4a20;font-weight:500;
  transition:background .12s,border-color .12s;
}
.wiki-ref:hover{background:linear-gradient(180deg,#b6924f42,#b6924f24);border-bottom-style:solid}
.cl{display:flex;align-items:flex-start;gap:9px;margin:.22em 0;padding:.1em 0}
.cl-box{display:inline-flex;padding-top:.28em}
.cl input[type=checkbox]{
  width:17px;height:17px;margin:0;cursor:pointer;accent-color:var(--seal);
}
.cl-text{flex:1;min-width:0}
.cl:has(input:checked) .cl-text{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:#8a745299}
.ntb{width:100%;border-collapse:collapse;margin:.9em 0;font-size:1rem}
.ntb th,.ntb td{border:1px solid #8a745273;padding:.4em .6em;vertical-align:top;min-width:52px}
.ntb th{
  background:#8c6b3f1a;font:600 .78rem var(--f-disp);letter-spacing:.08em;
  text-transform:uppercase;color:#5c4930;text-align:left;
}
img.note-img{
  max-width:100%;display:block;margin:.9em auto;border-radius:4px;cursor:pointer;
  border:1px solid #8a745259;box-shadow:0 3px 10px -2px #00000042;
  background:#fff;
}

/* ============ "aparece em" (rodapé) ============ */
.bl-sec{margin-top:34px;padding-top:14px;border-top:1px dashed #8a745259}
.bl-h{display:flex;align-items:center;gap:8px;font:600 .72rem var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:8px}
.bl-h .ic{width:14px;height:14px}
.bl-list{display:flex;flex-direction:column;gap:4px}
.rp-i{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  padding:7px 9px;border-radius:8px;border:1px solid transparent;
  transition:background .12s,border-color .12s;
}
.rp-i:hover{background:#8c6b3f14;border-color:#8c6b3f42}
.rp-ck{color:#5a7442;font-size:.95rem;line-height:1;padding-top:3px}
.rp-it{flex:1;min-width:0;display:flex;flex-direction:column}
.rp-it>span{font:600 .92rem var(--f-disp);letter-spacing:.02em;color:#3f2f1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-it small{font:italic .78rem var(--f-accent);color:var(--ink-faint)}
/* frase de cada citação, com o nome destacado (até 3 linhas) */
.rp-it>.rp-q{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;
  margin-top:3px;font:400 .86rem/1.45 var(--f-body);letter-spacing:0;color:var(--ink-soft);
}
.rp-q mark{background:#f0d48899;color:inherit;border-radius:2px;padding:0 .1em}
/* menções sem ligação: marcador mais claro e botão Ligar ao lado */
.rp-ck-men{color:var(--ink-faint)}
.rp-men{display:flex;align-items:flex-start;gap:4px}
.rp-men .rp-i{flex:1;min-width:0}
.rp-ligar{flex:0 0 auto;margin-top:6px;padding:4px 10px;font:600 .72rem var(--f-disp);letter-spacing:.05em}
.rp-mais{align-self:flex-start;font:600 .74rem var(--f-disp);letter-spacing:.05em;color:var(--bronze);padding:4px 6px;text-decoration:underline}
.bl-sec .rp-bl-h:first-child{border-top:0;padding-top:0}
.bl-sec .rp-list{margin-bottom:10px}

/* ============ painel de referência ============ */
.ref-panel{
  position:absolute;top:14px;right:14px;bottom:14px;z-index:14;
  width:min(360px,calc(100% - 28px));
  display:flex;flex-direction:column;gap:10px;
  padding:16px 16px 12px;border-radius:12px;color:var(--ink);
  background:var(--noise),linear-gradient(180deg,var(--parch-100),var(--parch-300));
  border:1px solid #8a745266;
  box-shadow:-16px 10px 34px -12px #000000ad, inset 0 0 40px #5a3c141f;
  transform:translateX(112%);opacity:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.25,.8,.3,1),opacity .25s;
  overflow:hidden;
}
.ref-panel.open{transform:none;opacity:1;pointer-events:auto}
.rp-head{display:flex;align-items:center;gap:8px}
.rp-head>.ic{color:var(--bronze);width:17px;height:17px}
.rp-head h3{flex:1;min-width:0;margin:0;font:600 1.15rem var(--f-disp);letter-spacing:.02em;color:#33250f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-sub{display:flex;align-items:center;gap:7px;font:italic .88rem var(--f-accent);color:var(--ink-soft)}
.rp-sub .ic{width:14px;height:14px;color:var(--bronze)}
.rp-type{display:flex;flex-direction:column;gap:2px}
.rp-type>span{font:600 .62rem var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}
.rp-type select{
  appearance:none;-webkit-appearance:none;
  border:0;border-bottom:1px solid #8a745259;
  background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m7 10 5 5 5-5' fill='none' stroke='%238a7452' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 2px center/13px no-repeat;
  padding:3px 20px 4px 1px;font-size:.98rem;cursor:pointer;
}
.rp-type select:focus{outline:none;border-bottom-color:var(--bronze)}
.rp-ex{margin:0;font-size:.94rem;line-height:1.5;color:var(--ink-soft)}
.rp-open{align-self:flex-start}
.rp-bl-h{font:600 .68rem var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);padding-top:6px;border-top:1px dashed #8a745259}
.rp-list{display:flex;flex-direction:column;gap:3px}
/* parte do painel que rola: as listas de citações */
.rp-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.rp-empty{font:italic .9rem var(--f-accent);color:var(--ink-faint);padding:8px 4px}
.pp-name{
  width:100%;border:0;border-bottom:1px solid #8a745266;background:transparent;
  padding:4px 2px;font:600 1.02rem var(--f-disp);color:#33250f;
}
.pp-name:focus{outline:none;border-bottom-color:var(--bronze)}
.pp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp-lbl{font:600 .62rem var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);margin-bottom:2px}
.pp-icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pp-icon-btn{
  aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:#8a745218;border:1px solid transparent;color:var(--ink-soft);
}
.pp-icon-btn:hover{background:#8a745230}
.pp-icon-btn.on{background:#8c6b3f2e;border-color:#8c6b3f70;color:#4d3722}
.pp-actions{display:flex;gap:8px;flex-wrap:wrap}
.pp-actions .btn{flex:1;min-width:120px;justify-content:center}
.pp-move.on{background:linear-gradient(180deg,#5a7442,#41552f);border-color:#33421f;color:#f2f6e9}
.pp-meta{display:flex;flex-direction:column;gap:3px;font:italic .82rem var(--f-accent);color:var(--ink-faint);padding-top:4px;border-top:1px dashed #8a745259}
.pp-note{
  min-height:100px;max-height:280px;overflow-y:auto;
  padding:8px 10px;border-radius:8px;
  background:#fffaf099;border:1px solid #8a745245;
  font-size:.94rem;line-height:1.55;color:var(--ink-soft);
}
.pp-note:focus{outline:none;border-color:var(--bronze);background:#fffaf0d9}
.pp-note p:first-child,.pp-note h1:first-child,.pp-note h2:first-child,.pp-note h3:first-child{margin-top:0}
.pp-note p:last-child{margin-bottom:0}
.pp-note img.note-img{max-width:100%}

/* ============ busca ============ */
.search-ov{
  position:fixed;inset:0;z-index:60;display:none;
  background:#160d08b8;backdrop-filter:blur(3px);
  padding:9dvh 16px 16px;justify-content:center;align-items:flex-start;
}
.search-ov.open{display:flex}
.s-box{
  width:min(620px,100%);max-height:78dvh;display:flex;flex-direction:column;
  border-radius:14px;overflow:hidden;
  background:var(--noise),linear-gradient(180deg,var(--parch-050),var(--parch-200));
  border:1px solid #8a745273;box-shadow:0 30px 70px -20px #000000e0;
}
.s-inrow{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #8a745242}
.s-inrow .ic{color:var(--bronze);width:19px;height:19px}
#searchInput{flex:1;min-width:0;border:0;background:transparent;font-size:1.12rem;color:var(--ink)}
#searchInput:focus{outline:none}
#searchInput::placeholder{color:#8a745299;font-style:italic;font-family:var(--f-accent)}
.s-res{overflow-y:auto;padding:8px}
.s-h{margin:8px 8px 4px;font:600 .66rem var(--f-disp);letter-spacing:.22em;text-transform:uppercase;color:#8a7452}
.s-chips{display:flex;flex-wrap:wrap;gap:7px;padding:8px}
.s-empty{padding:26px 16px;text-align:center;font:italic 1rem var(--f-accent);color:var(--ink-faint)}
.s-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 10px;border-radius:9px;transition:background .1s;
}
.s-item:hover{background:#8c6b3f1a}
.s-item.on{background:#8c6b3f22;border-left:2px solid var(--bronze);padding-left:8px}
.s-item .ni-ic .ic{width:17px;height:17px}
.s-new{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;margin-top:2px;border-top:1px dashed #8a745240;
  color:var(--ink-soft);
}
.s-new .ic{width:15px;height:15px;color:var(--bronze);flex:0 0 auto}
.s-new span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:italic .88rem var(--f-accent)}
.s-new:hover{background:#8c6b3f1a}
.s-new.on{background:#8c6b3f22;border-left:2px solid var(--bronze);padding-left:9px;border-top-color:transparent}
.s-foot{
  padding:7px 14px;text-align:center;border-top:1px solid #8a745226;
  font:.7rem var(--f-disp);letter-spacing:.03em;color:var(--ink-faint);
}
.side-quick kbd{font-size:.58rem;padding:2px 4px;letter-spacing:0}
.s-main{flex:1;min-width:0;display:flex;flex-direction:column}
.s-t{font:600 .96rem var(--f-disp);color:#3a2b19;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-s{font-size:.85rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-s mark,.s-t mark{background:#f0d488;border-radius:2px;padding:0 1px}
.s-meta{font:italic .76rem var(--f-accent);color:var(--ink-faint);flex:0 0 auto}

/* ============ modais ============ */
.modal-scrim{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:#160d08b3;backdrop-filter:blur(2px);padding:18px;
  opacity:0;transition:opacity .18s;
}
.modal-scrim.open{opacity:1}
.modal{
  width:min(430px,100%);max-height:86dvh;overflow-y:auto;
  padding:20px 22px 18px;border-radius:14px;position:relative;
  background:var(--noise),linear-gradient(180deg,var(--parch-050),var(--parch-200));
  border:1px solid #8a745280;
  box-shadow:0 0 0 4px #2e1c13, 0 0 0 5px #8c6b3f66, 0 28px 60px -18px #000000e6;
  transform:translateY(6px) scale(.985);transition:transform .18s;
}
.modal-scrim.open .modal{transform:none}
.m-orn{text-align:center;color:var(--bronze-bright);letter-spacing:.5em;text-indent:.5em;font-size:.8rem;margin-bottom:4px}
.m-title{margin:0 0 6px;text-align:center;font:600 1.2rem var(--f-disp);letter-spacing:.03em;color:#33250f}
.m-msg{margin:.2rem 0 1rem;text-align:center;color:var(--ink-soft);line-height:1.5}
.m-body{display:flex;flex-direction:column;gap:13px;margin:12px 0 4px}
.m-fld{display:flex;flex-direction:column;gap:3px}
.m-fld>span{font:600 .64rem var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}
.m-fld input,.m-fld select{
  border:0;border-bottom:1px solid #8a745266;background:transparent;
  padding:5px 2px;font-size:1.05rem;color:var(--ink);
}
.m-fld select{appearance:none;-webkit-appearance:none;background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m7 10 5 5 5-5' fill='none' stroke='%238a7452' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") right 4px center/14px no-repeat;cursor:pointer}
.m-fld input:focus,.m-fld select:focus{outline:none;border-bottom-color:var(--bronze)}
.ico-pick{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.ico-opt{
  width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #8a745245;color:var(--ink-soft);transition:background .1s,border-color .1s;
}
.ico-opt:hover{background:#8c6b3f14}
.ico-opt.on{border-color:var(--bronze);background:#8c6b3f24;color:#4d3722}
.m-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
/* importar: as duas maneiras (juntar ou substituir tudo), cada uma com a explicação embaixo */
.imp-ops{display:flex;flex-direction:column;gap:9px}
.imp-b{flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:10px 14px;text-align:left}
.imp-b b{font:600 .95rem var(--f-disp);letter-spacing:.03em}
.imp-b small{font:italic .86rem/1.4 var(--f-accent);opacity:.92}
.m-quick{max-width:480px}
.qc-input{
  width:100%;min-height:84px;max-height:280px;resize:vertical;box-sizing:border-box;
  border-radius:8px;padding:12px 14px;border:1px solid #8a745245;
  background:var(--noise),linear-gradient(180deg,var(--parch-050),var(--parch-200));
  font:1.05rem/1.55 var(--f-body);color:var(--ink);
}
.qc-input:focus{outline:none;border-color:var(--bronze)}
.qc-hint{margin-top:8px;text-align:center;font:italic .8rem var(--f-accent);color:var(--ink-faint)}
/* rodapé da captura rápida: dica à esquerda, botão Anotar (para toque) à direita */
.qc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.qc-foot .qc-hint{margin-top:0;text-align:left}
.qc-save{flex:0 0 auto;margin-left:auto}
/* destino da captura: em qual sessão (ou na Caixa de entrada) a anotação vai cair */
.qc-dest{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:9px}
.qc-dest-l{font:600 .62rem var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);margin-right:2px}
.qc-d{
  display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 11px;border-radius:999px;
  border:1px solid #8a745259;background:#f6ecd480;font-size:.86rem;color:var(--ink-soft);
}
.qc-d>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qc-d .ic{width:13px;height:13px}
.qc-d:hover{border-color:#8c6b3f}
.qc-d.on{background:#8c6b3f30;border-color:var(--bronze);color:#3a2b19;font-weight:600}
/* horário de cada anotação feita durante a sessão */
.page-body .nh{font-size:.82em;font-weight:600;color:var(--bronze);font-variant-numeric:lining-nums tabular-nums}

/* ============ popovers / paletas ============ */
#popRoot{position:fixed;inset:0;z-index:80;pointer-events:none}
#popRoot.has{pointer-events:none}
.pop{
  position:fixed;pointer-events:auto;min-width:170px;max-width:280px;
  padding:6px;border-radius:11px;
  background:var(--noise),linear-gradient(180deg,var(--parch-050),var(--parch-200));
  border:1px solid #8a745273;box-shadow:0 14px 34px -10px #000000c9;
  animation:popIn .14s ease-out;
}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop-i{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;font-size:.94rem;color:var(--ink-soft);
  transition:background .1s;
}
.pop-i:hover{background:#8c6b3f1c}
.pop-i .ic{width:15px;height:15px;color:var(--bronze)}
.pop-i.danger{color:#7d2b23}
.pop-i.danger .ic{color:#7d2b23}
.pop-sep{height:1px;background:#8a745240;margin:5px 8px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:4px}
.pal.inline{display:flex;padding:0}
.swatch{
  width:26px;height:26px;border-radius:50%;background:var(--c);
  border:1px solid #00000038;box-shadow:inset 0 1px 1px #ffffff40,0 1px 2px #00000030;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.8rem;color:var(--ink-faint);
  transition:transform .1s,box-shadow .1s;
}
.swatch:hover{transform:scale(1.12)}
.swatch.on{box-shadow:0 0 0 2px var(--parch-100),0 0 0 3.5px var(--bronze)}
.size-l{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);padding:0 6px}
.size-l .ic{width:14px;height:14px}
.size-l input[type=range]{width:86px;accent-color:var(--bronze)}

/* ============ toasts ============ */
#toastRoot{position:fixed;left:0;right:0;bottom:22px;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  padding:9px 18px;border-radius:999px;max-width:88%;
  background:var(--noise),linear-gradient(180deg,var(--parch-050),var(--parch-300));
  border:1px solid #8a745280;box-shadow:0 8px 24px -8px #000000cc;
  color:#4d3d26;font:italic .95rem var(--f-accent);
  opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:none}
.toast.warn{border-color:#7d2b23a1;color:#6b241d}

/* ============ modo mapa ============ */
.map-wrap{margin:0 0 18px}
.map-tools{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px;
  padding:6px;margin-bottom:4px;border-radius:10px;
  background:linear-gradient(180deg,#f2e6cae6,#e9d9b6e6);
  border:1px solid #8a745245;
}
.map-hint{
  font:600 .72rem var(--f-disp);letter-spacing:.03em;color:var(--bronze);
  margin:0 0 8px;padding:0 4px;display:flex;align-items:center;gap:6px;
}
.map-hint .ic{width:13px;height:13px}
.map-stage{
  position:relative;width:100%;border-radius:10px;overflow:hidden;
  border:1px solid #8a745266;box-shadow:inset 0 0 26px #5a3c1421,0 4px 12px -4px #00000047;
  background:var(--noise),linear-gradient(150deg,var(--parch-100),var(--parch-300));
  touch-action:none;
}
.map-stage.blank .map-world{
  background:
    repeating-linear-gradient(0deg,transparent 0 39px,#8a745218 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,#8a745218 39px 40px);
}
.map-stage[data-tool="nav"] .map-hit{cursor:grab}
.map-stage[data-tool="nav"].panning .map-hit{cursor:grabbing}
.map-stage[data-tool="pin"] .map-hit,
.map-stage[data-tool="pen"] .map-hit,.map-stage[data-tool="e"] .map-hit{cursor:crosshair}
.map-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#mapImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
#mapCv{position:absolute;inset:0}
.map-pins{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map-pin{position:absolute;left:0;top:0;pointer-events:none}
.mp-tail{position:absolute;left:-6px;bottom:0;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--pc);
  filter:drop-shadow(0 1px 1px #00000045);
}
.mp-badge{
  position:absolute;left:-15px;bottom:7px;width:30px;height:30px;border-radius:50%;
  background:var(--pc);border:2px solid #f6ecd4;box-shadow:0 2px 5px #00000059;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.mp-badge .ic{width:16px;height:16px;stroke:#f6ecd4;stroke-width:2}
.map-pin.on .mp-badge,.map-pin:hover .mp-badge{transform:scale(1.1)}
.mp-label{
  position:absolute;left:19px;bottom:21px;transform:translateY(50%);
  max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:600 .74rem var(--f-disp);letter-spacing:.03em;color:#33250f;
  background:#f6ecd4e6;border:1px solid #8a745259;border-left:3px solid var(--pc);border-radius:0 6px 6px 0;
  padding:2px 8px 2px 6px;box-shadow:0 1px 3px #00000030;
}
.map-pin.mp-flip .mp-label{left:auto;right:19px;border-left:1px solid #8a745259;border-right:3px solid var(--pc);border-radius:6px 0 0 6px;padding:2px 6px 2px 8px}
.map-hit{position:absolute;inset:0;touch-action:none}
.map-zoomctl{
  position:absolute;right:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;
  border-radius:10px;overflow:hidden;border:1px solid #8a745266;box-shadow:0 4px 14px -4px #00000059;
  background:var(--noise),linear-gradient(180deg,#f2e6cae6,#e9d9b6e6);
}
.map-zoomctl button{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font:600 1.15rem var(--f-disp);color:var(--ink-soft);
}
.map-zoomctl button:hover{background:#8a745226}
.map-zoomctl button:disabled{opacity:.35;pointer-events:none}
.map-zoomctl .zc-sep{height:1px;background:#8a745240;margin:0 4px}
.map-zoomctl .ic{width:15px;height:15px}
.map-note-h{
  margin:4px 0 8px;font:600 .7rem var(--f-disp);letter-spacing:.22em;
  text-transform:uppercase;color:var(--bronze);
}

/* ============ responsivo ============ */
@media (max-width:1200px){
  .app{grid-template-columns:236px 258px minmax(0,1fr)}
  .book{padding:18px 18px 22px}
  .page-scroll{padding:20px 24px 50px 22px}
}
@media (max-width:900px){
  .app{display:block;height:auto}
  .topbar{
    display:flex;align-items:center;gap:8px;position:fixed;inset:0 0 auto 0;z-index:30;height:54px;
    padding:0 10px;color:#ecdcbb;
    background:var(--noiseL),linear-gradient(180deg,#3a2519,#2b1a11);
    border-bottom:1px solid #b6924f38;box-shadow:0 4px 14px -6px #000;
  }
  .tb-title{flex:1;text-align:center;font:600 .98rem var(--f-disp);letter-spacing:.06em}
  .topbar .icon-btn{color:#ecdcbb;width:38px;height:38px}
  .scrim{display:block;position:fixed;inset:0;z-index:38;background:#160d08a6;opacity:0;pointer-events:none;transition:opacity .25s}
  body.m-side .scrim{opacity:1;pointer-events:auto}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(84vw,330px);
    transform:translateX(-106%);transition:transform .28s cubic-bezier(.25,.8,.3,1);
    box-shadow:16px 0 40px -10px #000;
  }
  body.m-side .sidebar{transform:none}
  .list-pane{position:fixed;inset:54px 0 0 0;border-right:0}
  .page-pane{
    position:fixed;inset:54px 0 0 0;z-index:20;
    transform:translateX(102%);transition:transform .3s cubic-bezier(.25,.8,.3,1);
  }
  body.m-page .page-pane{transform:none}
  .m-back{display:inline-flex}
  .book{padding:10px 8px 14px}
  .page-scroll{padding:14px 16px 46px 12px}
  .spine{flex-basis:16px}
  .p-title{font-size:1.55rem}
  .page-body{font-size:1.06rem}
  .fld{flex:1 1 100%;min-width:0}
  .tbar{top:-15px}
  .tb-lbl{display:none}
  .ref-panel{top:8px;right:8px;bottom:8px;width:calc(100% - 16px)}
  .p-cat{max-width:118px}
  /* no celular, os apelidos ficam embaixo do nome do campo */
  .fld-ap{flex-wrap:wrap}
  .fld-ap .ap-lista{flex-basis:100%}
}
/* botão flutuante de anotar: só aparece no celular */
.fab-cap{display:none}
@media (max-width:900px){
  .fab-cap{
    display:flex;align-items:center;justify-content:center;
    position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;
    width:58px;height:58px;border-radius:50%;color:#f6e3d2;
    background:linear-gradient(180deg,#8d352b,#6b241d);border:1px solid #4c1712;
    box-shadow:0 1px 0 #ffffff2b inset,0 8px 20px -6px #000000b3;
  }
  .fab-cap .ic{width:26px;height:26px}
  .fab-cap:active{transform:scale(.94)}
  /* some quando o menu ou o painel de referência estão abertos */
  body.m-side .fab-cap,body:has(.ref-panel.open) .fab-cap{display:none}
  /* espaço no fim da lista e da página, para o botão não cobrir as últimas linhas */
  .note-list{padding-bottom:92px}
  .page-scroll{padding-bottom:96px}
  /* a caixa de captura fica no alto da tela, longe do teclado do celular */
  .modal-scrim:has(.m-quick){align-items:flex-start;padding-top:64px}
  .m-quick .qc-hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ===================== 2.0: novidades ===================== */
/* lápis: trecho marcado como suspeita, em grafite, com um traço que se desenha (e some quando a teoria se confirma) */
.lapis{
  color:#5b574f;font-style:italic;padding-bottom:3px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M1 3.8C17 2.4 33 4.6 50 3.2S83 2.4 99 3.6' fill='none' stroke='%23857f74' stroke-width='1.4' stroke-linecap='round'/></svg>") left bottom/100% 6px no-repeat;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.lapis.lapis-novo{animation:lapisRisca .8s ease-out}
@keyframes lapisRisca{from{background-size:0% 6px;color:var(--ink)}40%{color:#5b574f}to{background-size:100% 6px}}
.lapis.lapis-sai{animation:lapisApaga .55s ease-in forwards}
@keyframes lapisApaga{to{background-size:0% 6px;color:var(--ink)}}

/* folha de rosto da campanha (no PC e no tablet); a moldura fica no meio quando cabe, e em tela baixa começa no alto e rola */
.folha-rosto .page-scroll{display:flex;flex-direction:column;align-items:center;padding:30px 48px 34px}
.fr-moldura{position:relative;width:100%;max-width:640px;margin:auto 0;padding:30px 34px 26px;text-align:center;
  border:1px solid #8c6b3f8c;outline:1px solid #8c6b3f59;outline-offset:5px;border-radius:4px;background:#f6ecd540}
.fr-emblema{display:block;width:58px;height:58px;margin:0 auto 8px;background:var(--tinta-capa,#8c6b3f);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='none' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8'><path stroke='%23000' d='M10 27V13h12v14M8 13h16V7h-2.7v2.6h-2.6V7h-2.7v2.6h-2.6V7h-2.7v2.6H10.7V7H8zM14 27v-5a2 2 0 0 1 4 0v5M7 27h18'/></g></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='none' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8'><path stroke='%23000' d='M10 27V13h12v14M8 13h16V7h-2.7v2.6h-2.6V7h-2.7v2.6h-2.6V7h-2.7v2.6H10.7V7H8zM14 27v-5a2 2 0 0 1 4 0v5M7 27h18'/></g></svg>") center/contain no-repeat}
.fr-sobre{font:600 .78rem var(--f-disp);letter-spacing:.32em;text-transform:uppercase;color:var(--bronze)}
.fr-nome{margin:4px 0 6px;font:500 2.9rem/1.1 var(--f-body);color:#2c2013}
.fr-moldura .orn{margin:0 0 8px}
.fr-moldura .orn svg{margin:0 auto}
.fr-sub{font:italic 1.05rem var(--f-body);color:var(--ink-faint)}
.fr-resumo{display:grid;gap:18px;margin:26px 0 6px;text-align:left}
.fr-bloco h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:600 .72rem var(--f-disp);letter-spacing:.22em;text-transform:uppercase;color:var(--seal)}
.fr-bloco h3::after{content:"";flex:1;height:1px;background:#8c6b3f66}
.fr-conta{font:600 .8rem var(--f-body);letter-spacing:0;padding:1px 8px;border-radius:999px;background:#7d2b231f}
.fr-abre{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;color:var(--ink);border-radius:6px;padding:3px 6px;margin-left:-6px}
.fr-abre:hover{background:#8c6b3f1c}
.fr-sessao b{font:500 1.3rem var(--f-body);color:#2c2013}
.fr-sessao span{font:italic 1rem var(--f-body);color:var(--ink-faint)}
.fr-trecho{margin:2px 0 0;font-size:.98rem;line-height:1.45;color:var(--ink-soft)}
.fr-lista{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.fr-lista .fr-abre{align-items:center;font-size:1.02rem}
.fr-lista i{margin-left:auto;font:italic .9rem var(--f-body);color:var(--ink-faint);white-space:nowrap}
.fr-caixa{flex:none;width:13px;height:13px;border:1.5px solid var(--bronze);border-radius:2px}
.fr-todas{margin-top:4px;font:italic .95rem var(--f-body);color:var(--seal);text-decoration:underline;text-underline-offset:3px}
.fr-marcadas{display:flex;flex-wrap:wrap;gap:8px}
.fr-chip{width:auto;margin:0;align-items:center;gap:6px;padding:4px 12px;border:1px solid #8a745266;border-radius:999px;background:#f6ecd5;font-size:1rem}
.fr-chip .ic{width:14px;height:14px;color:var(--seal)}
.fr-nada{margin:0;font:italic 1rem var(--f-body);color:var(--ink-faint)}
.fr-capitulos{margin-top:22px;padding-top:12px;border-top:1px solid #8c6b3f40;font:italic 1rem var(--f-body);color:var(--ink-faint)}
.fr-capitulos b{font-style:normal;font-weight:500;color:var(--ink-soft)}
.fr-cap{white-space:nowrap}
.fr-sep{margin:0 9px;color:var(--bronze)}

/* cabeça da página: retrato à esquerda, título no meio, selo de cera à direita
   (no tablet o título continua encostado à esquerda; o lado sem retrato ou sem selo não ocupa lugar) */
.cabeca{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center}
.cabeca .p-title{grid-column:2;grid-row:1}
.cabeca .orn{grid-column:2;grid-row:2}
.retrato{grid-column:1;grid-row:1/span 2;justify-self:start;width:92px;height:116px;margin:6px 16px 12px 0;padding:0;border-radius:50%;cursor:pointer;
  background:#d9c7a0 center/cover no-repeat;border:3px solid #b6924f;
  box-shadow:0 0 0 1px #6b4f2a,0 0 0 5px #efe2c4,0 0 0 6px #8c6b3f99,0 8px 16px #5a3c1440}
.selo-titulo{grid-column:3;grid-row:1/span 2;justify-self:end;width:64px;height:64px;margin-left:12px;background:center/contain no-repeat;
  transform:rotate(-8deg);filter:drop-shadow(0 2px 2px #00000070)}
.selo-titulo.batendo{animation:carimbo .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes carimbo{
  0%{transform:translateY(-14px) scale(2) rotate(-28deg);opacity:0}
  60%{transform:scale(.9) rotate(-5deg);opacity:1}
  100%{transform:scale(1) rotate(-8deg)}
}
@keyframes fitaCai{from{transform:translateY(-92px)}to{transform:none}}

/* janela da capa da campanha (engrenagem da campanha): o couro e o emblema */
.modal.m-capa{width:min(700px,100%)}
.capa-dlg{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:start;margin:6px 0 2px}
.capa-amostra{position:relative;height:260px;border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:#ecdcbb;text-align:center;box-shadow:inset 0 0 50px #00000066,0 10px 22px #0007}
.capa-amostra::before{content:"";position:absolute;inset:9px;border:1.5px dashed var(--stitch);border-radius:7px}
.capa-amostra .emblema{width:44px;height:44px;background:center/44px no-repeat}
.capa-amostra b{font:600 1.15rem/1.25 var(--f-disp);letter-spacing:.05em;text-shadow:0 1px 0 #000a}
.capa-amostra i{font:italic .95rem var(--f-accent);color:#b6924f}
.capa-opcoes h4{margin:0 0 8px;font:600 .72rem var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--seal)}
.capa-couros,.capa-emblemas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.capa-couro,.capa-emb{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #8a745266;border-radius:8px;background:#f6ecd5;
  font:500 .95rem var(--f-body);color:var(--ink-soft);text-align:left;white-space:nowrap}
.capa-couro span{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px #0006}
.capa-emb span{flex:none;width:22px;height:22px;background:var(--ink-soft);
  -webkit-mask-position:center;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;mask-position:center;mask-size:contain;mask-repeat:no-repeat}
.capa-couro:hover,.capa-emb:hover{border-color:var(--bronze)}
.capa-couro.on,.capa-emb.on{border-color:var(--seal);box-shadow:inset 3px 0 0 var(--seal);background:#fbf4e3;color:#2c2013}
.capa-emb.on span{background:var(--seal)}
@media (max-width:600px){
  .capa-dlg{grid-template-columns:minmax(0,1fr);gap:14px}
  .capa-amostra{height:150px}
  .capa-couros,.capa-emblemas{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* capa da campanha no celular: aparece um instante ao abrir o grimório e ao trocar de campanha */
.capa-celular{display:none}
@media (max-width:900px){
  .capa-celular{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;color:#ecdcbb;text-align:center;box-shadow:inset 0 0 120px #00000080}
  .capa-celular[hidden]{display:none}
  .capa-celular::before{content:"";position:absolute;inset:14px;border:2px dashed var(--stitch);border-radius:12px;pointer-events:none}
  .capa-celular .emblema{width:64px;height:64px;background:center/64px no-repeat}
  .capa-celular b{font:600 2rem/1.25 var(--f-disp);letter-spacing:.06em;text-shadow:0 1px 0 #000a}
  .capa-celular i{font:italic 1.2rem var(--f-accent);color:#b6924f}
  .capa-celular.saindo{animation:capaSai .45s ease-in forwards}
}
@keyframes capaSai{to{opacity:0;transform:translateX(-24%)}}

/* ===================== 2.0: novidades da página (no PC e no tablet) ===================== */
@media (min-width:901px){
  /* o nome do grimório, no alto do menu, abre a folha de rosto */
  .sidebar .brand{cursor:pointer}
  /* na lista, o selo de cera fica no lugar da bolinha colorida */
  .ni-f .st-dot{width:17px;height:17px;border-radius:0;box-shadow:none;background:transparent center/contain no-repeat;
    filter:drop-shadow(0 1px 1px #0000004d);margin:-3px 0}
  /* miniatura do retrato na lista */
  .ni-ic .ni-retrato{display:block;width:26px;height:32px;margin-top:-2px;border-radius:50%;background:#d9c7a0 center/cover no-repeat;
    box-shadow:0 0 0 1.5px #b6924f,0 0 0 2.5px #6b4f2a66}
  /* hora na margem: nas sessões, o horário das anotações da mesa vai para a margem, como num diário de bordo */
  .page-body ul.log{list-style:none;margin:8px 0 16px 64px;padding:0 0 0 14px;border-left:1px solid #7d2b2340}
  .page-body ul.log li{position:relative;margin:0 0 7px;padding:0}
  .page-body ul.log li::before{content:none}
  .page-body ul.log .nh{position:absolute;left:-80px;top:.1em;width:54px;text-align:right;
    font:italic 500 .95em var(--f-body);color:var(--seal);font-variant-numeric:lining-nums tabular-nums}
  /* anterior e próxima, no pé da página */
  .pe-pagina{display:flex;align-items:center;justify-content:center;gap:12px;margin:38px 0 6px;padding-top:12px;
    border-top:1px solid #8c6b3f40;color:var(--ink-faint)}
  .pe-pagina button{font:500 1.02rem var(--f-body);color:#4d3722;padding:4px 10px;border-radius:6px}
  .pe-pagina button:hover:not([disabled]){background:#8c6b3f1c;color:var(--seal)}
  .pe-pagina button[disabled]{opacity:.35;cursor:default}
  .pp-onde{font:italic 1rem var(--f-body)}
  .pp-onde::before,.pp-onde::after{content:"·";margin:0 10px;color:var(--bronze)}
  /* fita de marcador: aparece no alto da página quando ela está marcada (estrela) */
  .page.marcada::after{
    content:"";position:absolute;top:-6px;right:12px;z-index:7;width:17px;height:74px;pointer-events:none;
    background:linear-gradient(90deg,#5e1f19,#93392e 40%,#7d2b23 70%,#5e1f19);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
  }
  .page.marcada.fita-nova::after{animation:fitaCai .6s cubic-bezier(.3,1.3,.5,1)}
